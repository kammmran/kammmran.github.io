<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Academic Caption Generator — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-badge-cc"></i></div><div>Real-Time Caption Generator</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1000px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(74,222,128,0.12);color:var(--green)"><i class="ti ti-badge-cc"></i></div>
      <div>
        <div class="tool-title">Real-Time Academic Caption Generator</div>
        <div class="tool-desc">Large live captions for lectures, seminars and conferences. Project this on a second screen for accessibility. Adjustable font size, high-contrast mode, and a saved full transcript at the end.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row" style="gap:8px">
      <button class="btn btn-primary" id="rec"><i class="ti ti-microphone"></i> Start captions</button>
      <label class="fld">Language<select id="lang"></select></label>
      <label class="fld">Font<input type="range" id="size" min="20" max="72" value="40"></label>
      <button class="btn" id="theme"><i class="ti ti-contrast"></i> Contrast</button>
      <button class="btn" id="full"><i class="ti ti-maximize"></i> Full screen</button>
      <span class="muted" id="status" style="font-size:12px;margin-left:auto"></span>
    </div>
  </div>

  <div id="stage" style="margin-top:14px;border-radius:12px;background:#000;color:#fff;padding:28px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end">
    <div id="prev" style="opacity:.45;margin-bottom:10px"></div>
    <div id="live" style="font-weight:600"></div>
  </div>

  <div class="row" style="margin-top:12px">
    <button class="btn" id="copy"><i class="ti ti-copy"></i> Copy transcript</button>
    <button class="btn" id="dl"><i class="ti ti-download"></i> Download</button>
    <button class="btn" id="clear"><i class="ti ti-trash"></i> Clear</button>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  #stage.hi{background:#fff;color:#000} #stage.hi #prev{opacity:.5;color:#333}
  #stage{transition:background .2s,color .2s}</style>

<script>
const $=s=>document.querySelector(s);
const LANGS=[['en-US','English (US)'],['en-GB','English (UK)'],['es-ES','Spanish'],['fr-FR','French'],['de-DE','German'],['it-IT','Italian'],['ru-RU','Russian'],['tr-TR','Turkish'],['az-AZ','Azerbaijani'],['ar-SA','Arabic'],['zh-CN','Chinese'],['ja-JP','Japanese'],['ko-KR','Korean']];
$('#lang').innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recording=false,full=[];
function setSize(){const px=$('#size').value+'px';$('#live').style.fontSize=px;$('#prev').style.fontSize=(Math.round($('#size').value*0.7))+'px';}
$('#size').oninput=setSize;setSize();
$('#theme').onclick=()=>$('#stage').classList.toggle('hi');
$('#full').onclick=()=>{const s=$('#stage');if(s.requestFullscreen)s.requestFullscreen();};
function start(){
  if(!SR){$('#status').textContent='Use Chrome or Edge.';return;}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=$('#lang').value;
  rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const t=r[0].transcript.trim();full.push(t);$('#prev').textContent=$('#live').textContent;}else it+=r[0].transcript;}$('#live').textContent=it||(full[full.length-1]||'');};
  rec.onerror=e=>{$('#status').textContent='Error: '+e.error;};
  rec.onend=()=>{if(recording){try{rec.start();}catch(_){}}};
  try{rec.start();recording=true;$('#rec').innerHTML='<i class="ti ti-player-stop"></i> Stop';$('#rec').classList.remove('btn-primary');$('#status').textContent='Live';}catch(e){$('#status').textContent=e.message;}
}
function stop(){recording=false;if(rec)rec.stop();$('#rec').innerHTML='<i class="ti ti-microphone"></i> Start captions';$('#rec').classList.add('btn-primary');$('#status').textContent='Stopped';}
$('#rec').onclick=()=>recording?stop():start();
$('#clear').onclick=()=>{full=[];$('#live').textContent='';$('#prev').textContent='';};
$('#copy').onclick=()=>{navigator.clipboard.writeText(full.join(' '));$('#status').textContent='Copied.';};
$('#dl').onclick=()=>{const b=new Blob([full.join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='captions.txt';a.click();};
</script>
</body>
</html>
