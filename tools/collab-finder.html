<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Collaboration Finder - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-friends"></i></div><div>Collaboration Finder</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:880px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(74,222,128,0.12);color:var(--green)"><i class="ti ti-friends"></i></div>
      <div>
        <div class="tool-title">Research Collaboration Finder</div>
        <div class="tool-desc">The most active researchers publishing on your topic - potential collaborators, reviewers or labs to follow. Via OpenAlex.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <form id="f" class="row" style="gap:8px">
      <input type="text" id="q" placeholder="e.g. single-cell RNA sequencing, federated learning" style="flex:1;min-width:220px">
      <button class="btn btn-primary" type="submit"><i class="ti ti-search"></i> Find researchers</button>
    </form>
    <div id="out"><div class="muted">Enter a topic to see who publishes most in it.</div></div>
  </div>
</main>

<style>.arow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);margin-bottom:7px}
  .rank{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text2)}
  .arow a{color:var(--accent3);text-decoration:none}
  .cnt{margin-left:auto;font-size:12px;color:var(--text3);white-space:nowrap}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAIL='mailto=academy-tools@users.noreply.github.com';

$('#f').addEventListener('submit',async e=>{
  e.preventDefault(); const q=$('#q').value.trim(); if(!q) return;
  const out=$('#out'); out.innerHTML='<div class="muted"><i class="ti ti-loader"></i> Searching…</div>';
  try{
    const r=await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(q)}&group_by=authorships.author.id&${MAIL}`);
    const d=await r.json(); const g=(d.group_by||[]).filter(x=>x.key_display_name).slice(0,25);
    if(!g.length){ out.innerHTML='<div class="muted">No researchers found.</div>'; return; }
    out.innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:8px">Most prolific authors on "<b>${esc(q)}</b>". Cross-check fit and conflicts before reaching out.</div>`+
      g.map((a,i)=>`<div class="arow"><div class="rank">${i+1}</div>
        <a href="${esc(a.key)}" target="_blank" rel="noopener">${esc(a.key_display_name)}</a>
        <span class="cnt">${a.count.toLocaleString()} works on topic</span></div>`).join('');
  }catch(err){ out.innerHTML=`<div class="muted">Couldn't reach OpenAlex (${esc(err.message)}).</div>`; }
});
</script>

</body>
</html>
