<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-books"></i></div><div>Reading List</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1200px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(74,222,128,0.12);color:var(--green)"><i class="ti ti-books"></i></div>
      <div>
        <div class="tool-title">Reading List</div>
        <div class="tool-desc">Track papers, books, and articles. Status, rating, notes. Export CSV/JSON.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto">
    <div class="panel-label"><span>Add an item</span></div>
    <div class="row" style="gap:8px">
      <input type="text" id="i-title" placeholder="Title" style="flex:2; min-width:240px">
      <input type="text" id="i-author" placeholder="Author(s)" style="flex:1; min-width:160px">
      <input type="text" id="i-id" placeholder="DOI / ISBN / URL" style="flex:1; min-width:180px">
      <select id="i-status">
        <option value="to-read">To read</option>
        <option value="reading">Reading</option>
        <option value="done">Done</option>
      </select>
      <select id="i-type">
        <option value="paper">Paper</option>
        <option value="book">Book</option>
        <option value="article">Article</option>
        <option value="report">Report</option>
        <option value="other">Other</option>
      </select>
      <button class="btn btn-primary" id="add-btn"><i class="ti ti-plus"></i> Add</button>
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <div class="panel-label">
      <span>Library (<span id="count">0</span>)</span>
      <div class="panel-actions">
        <input type="search" id="search" placeholder="Search…" style="width:220px">
        <select id="filter">
          <option value="all">All status</option>
          <option value="to-read">To read</option>
          <option value="reading">Reading</option>
          <option value="done">Done</option>
        </select>
        <select id="sort">
          <option value="added-desc">Recently added</option>
          <option value="added-asc">Oldest first</option>
          <option value="rating">Top rated</option>
          <option value="title">Title A→Z</option>
          <option value="author">Author A→Z</option>
        </select>
        <button class="btn btn-sm" id="export-json"><i class="ti ti-download"></i> JSON</button>
        <button class="btn btn-sm" id="export-csv"><i class="ti ti-download"></i> CSV</button>
      </div>
    </div>
    <div id="list" class="muted" style="font-size:14px">Nothing in your library yet.</div>
  </div>

  <div class="workspace" style="margin-top:16px">
    <div class="panel">
      <div class="panel-label"><span>Stats</span></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="s-total">0</div></div>
        <div class="stat-card"><div class="stat-label">To read</div><div class="stat-value" id="s-to" style="color:var(--blue)">0</div></div>
        <div class="stat-card"><div class="stat-label">Reading</div><div class="stat-value" id="s-now" style="color:var(--amber)">0</div></div>
        <div class="stat-card"><div class="stat-label">Done</div><div class="stat-value" id="s-done" style="color:var(--green)">0</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-label"><span>By type</span></div>
      <div id="by-type" class="muted" style="font-size:13px">-</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Done</span></div>

<style>
.lib-row { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; }
.lib-head { display:flex; gap:10px; align-items:flex-start; }
.lib-title { flex:1; min-width:0; }
.lib-title b { color: var(--text); font-size: 14px; font-weight: 600; display: block; margin-bottom: 2px; word-wrap: break-word; }
.lib-meta { font-size: 12px; color: var(--text3); display:flex; gap:10px; flex-wrap:wrap; }
.status-chip { font-size: 11px; padding: 2px 10px; border-radius: 999px; }
.status-to-read { background: rgba(96,165,250,0.12); color: var(--blue); }
.status-reading { background: rgba(251,191,36,0.12); color: var(--amber); }
.status-done { background: rgba(74,222,128,0.12); color: var(--green); }
.lib-actions { display:flex; gap:4px; }
.star { cursor: pointer; color: var(--border2); font-size: 14px; transition: color .15s; }
.star.on { color: var(--amber); }
.star:hover { color: var(--amber); }
.lib-notes { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.lib-row.open .lib-notes { display: block; }
.lib-notes textarea { min-height: 70px; font-family: inherit !important; font-size: 13px !important; }
</style>

<script>
const $ = s => document.querySelector(s);
const STORE = 'reading-list-v1';

let items = JSON.parse(localStorage.getItem(STORE) || '[]');
function save() { localStorage.setItem(STORE, JSON.stringify(items)); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function toast(m) { const t = $('#toast'); $('#toast-msg').textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }

function linkify(s) {
  if (!s) return '';
  if (/^10\.\d{4,9}\//.test(s)) return `<a href="https://doi.org/${s}" target="_blank" rel="noopener" style="color:var(--accent3)">${escapeHtml(s)}</a>`;
  if (/^\d{9,13}[Xx]?$/.test(s)) return `<a href="https://openlibrary.org/isbn/${s}" target="_blank" rel="noopener" style="color:var(--accent3)">ISBN ${escapeHtml(s)}</a>`;
  if (/^https?:\/\//.test(s)) return `<a href="${escapeHtml(s)}" target="_blank" rel="noopener" style="color:var(--accent3)"><i class="ti ti-external-link"></i> link</a>`;
  return escapeHtml(s);
}

function filteredItems() {
  const q = $('#search').value.trim().toLowerCase();
  const f = $('#filter').value;
  return items.filter(i => {
    if (f !== 'all' && i.status !== f) return false;
    if (q && !((i.title + ' ' + (i.author||'') + ' ' + (i.ref || '') + ' ' + (i.notes || '')).toLowerCase().includes(q))) return false;
    return true;
  });
}

function sortedItems(arr) {
  const s = $('#sort').value;
  const a = [...arr];
  if (s === 'added-desc') return a.sort((x, y) => (y.added||0) - (x.added||0));
  if (s === 'added-asc') return a.sort((x, y) => (x.added||0) - (y.added||0));
  if (s === 'rating') return a.sort((x, y) => (y.rating||0) - (x.rating||0));
  if (s === 'title') return a.sort((x, y) => x.title.localeCompare(y.title));
  if (s === 'author') return a.sort((x, y) => (x.author||'').localeCompare(y.author||''));
  return a;
}

function render() {
  $('#count').textContent = items.length;
  const list = $('#list');
  const shown = sortedItems(filteredItems());
  if (!items.length) list.innerHTML = 'Nothing in your library yet.';
  else if (!shown.length) list.innerHTML = '<span class="muted">No items match.</span>';
  else {
    list.innerHTML = shown.map(i => `
      <div class="lib-row" data-id="${i.id}">
        <div class="lib-head">
          <div class="lib-title">
            <b>${escapeHtml(i.title)}</b>
            <div class="lib-meta">
              ${i.author ? `<span><i class="ti ti-user"></i> ${escapeHtml(i.author)}</span>` : ''}
              ${i.ref ? `<span><i class="ti ti-link"></i> ${linkify(i.ref)}</span>` : ''}
              <span><i class="ti ti-tag"></i> ${escapeHtml(i.type || 'paper')}</span>
              <span class="status-chip status-${i.status || 'to-read'}">${(i.status || 'to-read').replace('-', ' ')}</span>
              <span class="row" style="gap:0">
                ${[1,2,3,4,5].map(n => `<span class="star ${n <= (i.rating||0) ? 'on' : ''}" data-star="${i.id}|${n}">★</span>`).join('')}
              </span>
            </div>
          </div>
          <div class="lib-actions">
            <button class="btn btn-sm" data-toggle="${i.id}" title="Notes"><i class="ti ti-notes"></i></button>
            <button class="btn btn-sm" data-cycle="${i.id}" title="Cycle status"><i class="ti ti-rotate"></i></button>
            <button class="btn btn-sm" data-rm="${i.id}" style="color:var(--red)"><i class="ti ti-trash"></i></button>
          </div>
        </div>
        <div class="lib-notes">
          <textarea data-notes="${i.id}" placeholder="Your notes…">${escapeHtml(i.notes || '')}</textarea>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
      items = items.filter(x => x.id !== b.dataset.rm); save(); render();
    }));
    list.querySelectorAll('[data-cycle]').forEach(b => b.addEventListener('click', () => {
      const t = items.find(x => x.id === b.dataset.cycle);
      const order = ['to-read', 'reading', 'done'];
      t.status = order[(order.indexOf(t.status || 'to-read') + 1) % 3];
      save(); render();
    }));
    list.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
      b.closest('.lib-row').classList.toggle('open');
    }));
    list.querySelectorAll('[data-notes]').forEach(t => t.addEventListener('input', () => {
      const it = items.find(x => x.id === t.dataset.notes);
      it.notes = t.value; save();
    }));
    list.querySelectorAll('[data-star]').forEach(s => s.addEventListener('click', () => {
      const [id, n] = s.dataset.star.split('|');
      const it = items.find(x => x.id === id);
      it.rating = it.rating === +n ? 0 : +n;
      save(); render();
    }));
  }

  $('#s-total').textContent = items.length;
  $('#s-to').textContent = items.filter(i => i.status === 'to-read').length;
  $('#s-now').textContent = items.filter(i => i.status === 'reading').length;
  $('#s-done').textContent = items.filter(i => i.status === 'done').length;

  const types = {};
  items.forEach(i => { types[i.type || 'paper'] = (types[i.type || 'paper'] || 0) + 1; });
  const entries = Object.entries(types);
  $('#by-type').innerHTML = entries.length
    ? entries.map(([t, n]) => `<div style="padding:4px 0; display:flex; justify-content:space-between"><span>${escapeHtml(t)}</span><b style="color:var(--text2)">${n}</b></div>`).join('')
    : '-';
}

$('#add-btn').addEventListener('click', () => {
  const title = $('#i-title').value.trim();
  if (!title) { toast('Title required'); return; }
  items.push({
    id: uid(),
    title,
    author: $('#i-author').value.trim(),
    ref: $('#i-id').value.trim(),
    status: $('#i-status').value,
    type: $('#i-type').value,
    rating: 0,
    notes: '',
    added: Date.now()
  });
  save();
  $('#i-title').value = ''; $('#i-author').value = ''; $('#i-id').value = '';
  $('#i-title').focus();
  render();
  toast('Added');
});

$('#i-title').addEventListener('keydown', e => { if (e.key === 'Enter') $('#add-btn').click(); });
$('#search').addEventListener('input', render);
$('#filter').addEventListener('change', render);
$('#sort').addEventListener('change', render);
$('#export-json').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reading-list.json'; a.click();
});
$('#export-csv').addEventListener('click', () => {
  const rows = [['Title','Author','Identifier','Type','Status','Rating','Notes']];
  for (const i of items) rows.push([i.title, i.author||'', i.ref||'', i.type||'', i.status||'', i.rating||0, (i.notes||'').replace(/\n/g,' ')]);
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reading-list.csv'; a.click();
});

render();
</script>

</body>
</html>
