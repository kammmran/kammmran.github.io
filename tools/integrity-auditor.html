<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Integrity Auditor — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-scale"></i></div><div>Research Integrity Auditor</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:860px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-scale"></i></div>
      <div>
        <div class="tool-title">Research Integrity Auditor</div>
        <div class="tool-desc">A whole-project integrity audit across data, analysis, authorship, ethics and reporting — tick what's in place to get an integrity score.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:6px">
    <div id="prog"></div>
    <div id="groups"></div>
  </div>
</main>

<style>.grp{margin-top:14px}.grp h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent3);margin:0 0 8px;display:flex;justify-content:space-between}.grp h4 span{color:var(--text3);font-weight:400}
  .item{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);margin-bottom:6px;cursor:pointer;font-size:13px;line-height:1.45}
  .item input{margin-top:2px;width:16px;height:16px;flex:none}.item.done{border-color:rgba(124,109,240,0.4)}
  .meter{height:16px;border-radius:8px;background:var(--bg3);overflow:hidden;margin:8px 0}.meter>div{height:100%;transition:width .3s}
  .subscores{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ss{flex:1;min-width:90px;padding:8px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);text-align:center}.ss b{display:block;font-size:17px}</style>

<script>
const $ = s => document.querySelector(s);
const GROUPS=[
  ['Data',[ 'Raw data retained and securely stored','Data collection documented and reproducible','No selective deletion of inconvenient data points','Data deposited / available with the paper' ]],
  ['Analysis',[ 'Analysis plan defined before seeing results','Multiple comparisons corrected for','No p-hacking / cherry-picking of significant results','Analysis code is available and runs end-to-end' ]],
  ['Reporting',[ 'All measured outcomes reported (no selective reporting)','Limitations openly discussed','Claims are calibrated to the evidence (no overclaiming)','Figures show real, unmanipulated data' ]],
  ['Authorship & credit',[ 'All authors meet authorship criteria','No gift/ghost authorship','Contributions documented (CRediT)','Prior work and sources properly cited (no plagiarism / self-plagiarism)' ]],
  ['Ethics & disclosure',[ 'Ethics/IRB approval obtained where required','Informed consent obtained','Conflicts of interest disclosed','Funding sources disclosed','AI-tool use disclosed where applicable' ]],
];
$('#groups').innerHTML=GROUPS.map((g,gi)=>`<div class="grp"><h4>${g[0]} <span class="gc" data-g="${gi}"></span></h4>${g[1].map((it,ii)=>`<label class="item"><input type="checkbox" id="c${gi}_${ii}"><span>${it}</span></label>`).join('')}</div>`).join('');

function run(){
  let total=0,done=0; const gd=GROUPS.map(()=>0), gt=GROUPS.map(g=>g[1].length);
  GROUPS.forEach((g,gi)=>g[1].forEach((_,ii)=>{ total++; if($('#c'+gi+'_'+ii).checked){done++;gd[gi]++;} }));
  document.querySelectorAll('.item').forEach(l=>l.classList.toggle('done',l.querySelector('input').checked));
  document.querySelectorAll('.gc').forEach(s=>{const gi=+s.dataset.g; s.textContent=`${gd[gi]}/${gt[gi]}`;});
  const pct=Math.round(done/total*100); const band=pct>=85?'--green':pct>=60?'--amber':'--red';
  const grade=pct>=90?'A':pct>=75?'B':pct>=60?'C':pct>=40?'D':'F';
  $('#prog').innerHTML=`<div class="row" style="justify-content:space-between"><b style="font-size:15px">Integrity score</b><span style="color:var(${band})"><b>${pct}%</b> · grade ${grade}</span></div>
    <div class="meter"><div style="width:${pct}%;background:var(${band})"></div></div>
    <div class="subscores">${GROUPS.map((g,gi)=>{const r=gd[gi]/gt[gi];const c=r>=0.8?'--green':r>=0.5?'--amber':'--red';return `<div class="ss"><b style="color:var(${c})">${Math.round(r*100)}%</b>${g[0]}</div>`;}).join('')}</div>
    <div class="muted" style="font-size:12px;margin-top:8px">Any unchecked item in Ethics or Authorship is a hard blocker — fix those before anything else.</div>`;
}
document.querySelectorAll('#groups input').forEach(c=>c.addEventListener('change',run));
run();
</script>

</body>
</html>
