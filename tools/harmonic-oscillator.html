<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Harmonic Oscillator - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-chart-arcs"></i></div><div>Harmonic Oscillator</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-chart-arcs"></i></div>
      <div>
        <div class="tool-title">Quantum Harmonic Oscillator</div>
        <div class="tool-desc">Evenly spaced levels Eₙ = (n+½)ħω in a parabolic well, with the wavefunction ψₙ or |ψₙ|² on its level.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row">
      <label class="fld">Quantum number n<input type="number" id="n" value="2" min="0" max="10"></label>
      <label class="fld" style="flex-direction:row;align-items:center;gap:7px;margin-top:18px"><input type="checkbox" id="prob" style="width:16px;height:16px"> Show |ψ|²</label>
    </div>
    <svg id="svg" viewBox="0 0 760 360" style="width:100%;height:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px"></svg>
    <div id="info"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  svg text{fill:var(--text3);font-size:11px}</style>

<script>
const $ = s => document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function hermite(n,x){ if(n===0)return 1; if(n===1)return 2*x; let hm=1,h=2*x; for(let k=1;k<n;k++){ const hn=2*x*h-2*k*hm; hm=h; h=hn; } return h; }
function fact(n){ let f=1; for(let i=2;i<=n;i++)f*=i; return f; }
function psi(n,x){ const norm=1/Math.sqrt(Math.pow(2,n)*fact(n)*Math.sqrt(Math.PI)); return norm*hermite(n,x)*Math.exp(-x*x/2); }

function run(){
  const n=Math.max(0,Math.min(10,Math.round(+$('#n').value||0))); $('#n').value=n;
  const prob=$('#prob').checked;
  const svg=$('#svg'); svg.innerHTML='';
  const W=760,H=360,pl=48,pr=20,pt=16,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  // energy in units of ħω, levels 0.5,1.5,... show up to max(n+2,6)
  const nmax=Math.max(n+1,5);
  const Emax=nmax+1; // ħω units
  const X=xi=>pl+(xi+5)/10*iw;   // xi in [-5,5]
  const Y=E=>pt+(1-E/Emax)*ih;
  const ln=(x1,y1,x2,y2,col,d,w)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',col);l.setAttribute('stroke-width',w||1.2);if(d)l.setAttribute('stroke-dasharray',d);svg.appendChild(l);};
  const tx=(x,y,t,a,fl)=>{const e=document.createElementNS(NS,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('text-anchor',a||'middle');if(fl)e.setAttribute('fill',fl);e.textContent=t;svg.appendChild(e);};
  ln(pl,pt,pl,H-pb,'var(--border2)'); ln(pl,H-pb,W-pr,H-pb,'var(--border2)');
  // parabola V=½ξ²  (in ħω units, V=0.5*xi^2)
  let pd=''; for(let i=0;i<=200;i++){ const xi=-5+10*i/200; const V=0.5*xi*xi; if(V<=Emax){ pd+=(pd===''?'M':'L')+X(xi).toFixed(1)+' '+Y(V).toFixed(1)+' '; } }
  const par=document.createElementNS(NS,'path');par.setAttribute('d',pd);par.setAttribute('fill','none');par.setAttribute('stroke','var(--border2)');par.setAttribute('stroke-width','2');svg.appendChild(par);
  // levels
  for(let k=0;k<nmax;k++){ const E=k+0.5; const turn=Math.sqrt(2*E); const sel=(k===n); ln(X(-turn),Y(E),X(turn),Y(E),sel?'var(--accent3)':'var(--border)',null,sel?2:1); tx(pl-6,Y(E)+3,'n='+k,'end',sel?'var(--accent3)':'var(--text3)'); }
  // selected wavefunction overlaid on its level
  const E=n+0.5; const amp=ih/Emax*0.9; // visual amplitude
  let d=''; const N=300; for(let i=0;i<=N;i++){ const xi=-5+10*i/N; let val=psi(n,xi); val=prob?val*val:val; d+=(i?'L':'M')+X(xi).toFixed(1)+' '+(Y(E)-val*amp).toFixed(1)+' '; }
  const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',prob?'var(--teal)':'var(--accent3)');p.setAttribute('stroke-width','2.5');svg.appendChild(p);
  tx(pl+iw/2,H-3,'Position ξ','middle','var(--text3)');
  tx(14,pt+ih/2,'Energy (ħω)','middle','var(--text3)').setAttribute('transform',`rotate(-90 14 ${pt+ih/2})`);

  $('#info').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Eₙ</div><div class="stat-value" style="color:var(--accent3)">(${n} + ½) ħω = ${(n+0.5)} ħω</div></div>
      <div class="stat-card"><div class="stat-label">Level spacing</div><div class="stat-value">ħω (constant)</div></div>
      <div class="stat-card"><div class="stat-label">Zero-point energy</div><div class="stat-value">½ ħω</div></div>
      <div class="stat-card"><div class="stat-label">Nodes</div><div class="stat-value">${n}</div></div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">Unlike the box, oscillator levels are <b>equally spaced</b> by ħω. The wavefunction leaks slightly past the classical turning points (tunneling into the wall). Models molecular bond vibrations (IR spectroscopy).</div>`;
}
['n','prob'].forEach(id=>$('#'+id).addEventListener('input',run));
run();
</script>

</body>
</html>
