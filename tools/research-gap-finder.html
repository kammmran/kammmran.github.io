<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Gap Finder — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-zoom-question"></i></div><div>Research Gap Finder</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:900px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-zoom-question"></i></div>
      <div>
        <div class="tool-title">Research Gap Finder</div>
        <div class="tool-desc">Map a topic's sub-areas by how much they've been studied, test specific intersections for thin coverage, and work a structured gap framework. Via OpenAlex.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <form id="f" class="row" style="gap:8px">
      <input type="text" id="q" placeholder="Your topic, e.g. microplastics in freshwater" style="flex:1;min-width:220px">
      <button class="btn btn-primary" type="submit"><i class="ti ti-search"></i> Scan</button>
    </form>
    <div id="out"></div>
    <div id="combo" style="display:none">
      <label class="fld">Test a specific angle (combined with your topic) — low counts signal a gap
        <div class="row" style="gap:8px"><input type="text" id="angle" placeholder="e.g. machine learning, children, longitudinal, Africa" style="flex:1"><button class="btn" id="testBtn">Test</button></div>
      </label>
      <div id="comboOut"></div>
    </div>
    <div id="framework"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;margin:3px;display:inline-block}
  .pill.lo{background:rgba(74,222,128,0.16);color:var(--green)} .pill.mid{background:var(--surface2);color:var(--text2)} .pill.hi{background:rgba(248,113,113,0.14);color:var(--red)}
  .gap-card{padding:10px 13px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);margin-bottom:7px;font-size:13px}
  .gap-card b{color:var(--accent3)}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAIL='mailto=academy-tools@users.noreply.github.com';
let TOPIC='';

const FRAMEWORK=[
  ['Evidence gap','Findings that contradict each other or lack confirmation','Where do studies disagree? What result has never been replicated?'],
  ['Population gap','Groups under-represented in the literature','Which populations, regions or settings are missing?'],
  ['Methodological gap','Methods not yet applied to this problem','What method (longitudinal, RCT, ML, qualitative) is rarely used here?'],
  ['Empirical gap','Claims asserted but not empirically tested','Which common assumption lacks direct measurement?'],
  ['Theoretical gap','Phenomena lacking an explanatory framework','What is described but not yet explained by theory?'],
  ['Practical/knowledge gap','Distance between research and real-world application','What works in the lab but is untested in practice?'],
];

$('#f').addEventListener('submit',async e=>{
  e.preventDefault(); const q=$('#q').value.trim(); if(!q) return; TOPIC=q;
  const out=$('#out'); out.innerHTML='<div class="muted"><i class="ti ti-loader"></i> Mapping sub-areas…</div>';
  try{
    const d=await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(q)}&group_by=concepts.id&${MAIL}`).then(r=>r.json());
    const g=(d.group_by||[]).filter(x=>x.key_display_name).slice(0,18);
    const max=Math.max(...g.map(x=>x.count),1);
    out.innerHTML=`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px">Sub-areas by study volume <span style="text-transform:none;letter-spacing:0">(green = thin / candidate gap)</span></div>`+
      g.map(c=>{ const r=c.count/max; const cls=r<0.18?'lo':r<0.5?'mid':'hi'; return `<span class="pill ${cls}">${esc(c.key_display_name)} · ${c.count.toLocaleString()}</span>`; }).join('');
    $('#combo').style.display=''; $('#framework').innerHTML=`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin:14px 0 8px">Gap framework — questions to interrogate the field</div>`+
      FRAMEWORK.map(([t,d2,q2])=>`<div class="gap-card"><b>${t}</b> — ${d2}<div style="color:var(--text3);margin-top:3px">↳ ${q2}</div></div>`).join('');
  }catch(err){ out.innerHTML=`<div class="muted">Couldn't reach OpenAlex (${esc(err.message)}).</div>`; }
});

$('#testBtn').addEventListener('click',async ()=>{
  const a=$('#angle').value.trim(); if(!a||!TOPIC) return;
  const o=$('#comboOut'); o.innerHTML='<div class="muted" style="font-size:12px"><i class="ti ti-loader"></i> Counting…</div>';
  try{
    const [both,base]=await Promise.all([
      fetch(`https://api.openalex.org/works?search=${encodeURIComponent(TOPIC+' '+a)}&${MAIL}`).then(r=>r.json()),
      fetch(`https://api.openalex.org/works?search=${encodeURIComponent(TOPIC)}&${MAIL}`).then(r=>r.json())
    ]);
    const n=both.meta.count, base_n=base.meta.count; const pct=base_n?(n/base_n*100):0;
    const verdict=n<50?{t:'Strong gap — very few papers',c:'--green'}:pct<3?{t:'Likely gap — under-explored angle',c:'--green'}:pct<10?{t:'Some coverage — room to contribute',c:'--amber'}:{t:'Well covered',c:'--red'};
    o.innerHTML=`<div class="gap-card"><b>"${esc(TOPIC)}" × "${esc(a)}"</b>: ${n.toLocaleString()} papers (${pct.toFixed(1)}% of topic) — <span style="color:var(${verdict.c})">${verdict.t}</span></div>`;
  }catch(err){ o.innerHTML=`<div class="muted">Error: ${esc(err.message)}</div>`; }
});
</script>

</body>
</html>
