<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Substructure Search - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-zoom-code"></i></div><div>Substructure Search</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1100px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(74,222,128,0.12);color:var(--green)"><i class="ti ti-zoom-code"></i></div>
      <div>
        <div class="tool-title">Substructure Search</div>
        <div class="tool-desc">Check whether a query fragment occurs in one or many target molecules, and filter a SMILES list by it.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto">
    <div class="grid2">
      <label class="fld">Query fragment (SMILES)<input type="text" id="query" placeholder="e.g. c1ccccc1 (benzene ring)" style="font-family:ui-monospace,Menlo,monospace"></label>
      <div style="display:flex;gap:10px;align-items:flex-end">
        <div id="qpic" style="background:#fff;border-radius:var(--radius-sm);width:120px;height:90px;display:flex;align-items:center;justify-content:center"></div>
      </div>
    </div>
    <div id="qerr" style="color:var(--red);font-size:12px;margin-top:6px"></div>
  </div>

  <div class="panel" style="min-height:auto;margin-top:16px">
    <div class="panel-label"><span>Target molecules (one SMILES per line)</span><button class="btn btn-sm btn-ghost" id="sample">Sample</button></div>
    <textarea id="targets" placeholder="CCO ethanol&#10;c1ccccc1O phenol&#10;CC(=O)Oc1ccccc1C(=O)O aspirin" style="min-height:110px"></textarea>
    <div class="panel-label" style="margin-top:14px"><span>Matches</span><span class="muted" id="stat" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div>
    <div id="results" class="results-grid"></div>
  </div>
</main>

<div class="toast" id="toast"><i class="ti ti-check"></i><span></span></div>

<style>
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}
  @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px}
  .rc{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .rc .pic{background:#fff;height:130px;display:flex;align-items:center;justify-content:center;padding:4px}
  .rc .ft{font-size:11px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:ui-monospace,Menlo,monospace}
  .rc.match{border-color:rgba(74,222,128,0.5)} .rc.match .ft{background:rgba(74,222,128,0.1)}
  .rc.no{opacity:.55} .rc.bad .pic{height:auto;padding:20px 8px;color:var(--red);font-size:12px;background:var(--surface)}
</style>

<script src="https://cdn.jsdelivr.net/npm/openchemlib@8/dist/openchemlib-full.js"></script>
<script>
const $ = s => document.querySelector(s);
function toast(m){ const t=$('#toast'); t.querySelector('span').textContent=m; t.classList.add('show'); clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ready(cb){ if(window.OCL&&OCL.Molecule)return cb(); let n=0;const iv=setInterval(()=>{if(window.OCL&&OCL.Molecule){clearInterval(iv);cb();}else if(++n>60){clearInterval(iv);$('#qerr').textContent='Could not load chemistry engine.';}},100); }

function run(){
  ready(()=>{
    const qsmi=$('#query').value.trim(); $('#qerr').textContent='';
    let frag=null;
    if(qsmi){
      try{ frag=OCL.Molecule.fromSmiles(qsmi); if(frag.getAllAtoms()===0) throw 0; frag.setFragment(true);
        $('#qpic').innerHTML=OCL.Molecule.fromSmiles(qsmi).toSVG(120,90,'q',{autoCrop:true,autoCropMargin:6});
      }catch(e){ $('#qerr').textContent='Invalid query SMILES.'; frag=null; $('#qpic').innerHTML=''; }
    } else $('#qpic').innerHTML='';

    const lines=$('#targets').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const searcher=new OCL.SSSearcher();
    let matched=0, valid=0;
    const cards=lines.map(line=>{
      const parts=line.split(/\s+/); const smi=parts[0]; const label=parts.slice(1).join(' ')||smi;
      let mol;
      try{ mol=OCL.Molecule.fromSmiles(smi); if(mol.getAllAtoms()===0) throw 0; }
      catch(e){ return `<div class="rc bad"><div class="pic">Invalid SMILES</div><div class="ft">${esc(smi)}</div></div>`; }
      valid++;
      let isMatch=false;
      if(frag){ try{ searcher.setMolecule(mol); searcher.setFragment(frag); isMatch=searcher.isFragmentInMolecule(); }catch(e){} }
      if(isMatch) matched++;
      const svg=mol.toSVG(180,130,'m',{autoCrop:true,autoCropMargin:6});
      return `<div class="rc ${frag?(isMatch?'match':'no'):''}"><div class="pic">${svg}</div><div class="ft" title="${esc(smi)}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>${frag?(isMatch?'<i class="ti ti-check" style="color:var(--green)"></i>':'<i class="ti ti-x" style="color:var(--text3)"></i>'):''}</div></div>`;
    });
    $('#stat').textContent = frag&&lines.length?`${matched}/${valid} contain the fragment`:'';
    $('#results').innerHTML = cards.join('') || '<div class="muted" style="grid-column:1/-1">Add target molecules above.</div>';
  });
}
['query','targets'].forEach(id=>$('#'+id).addEventListener('input',()=>{clearTimeout(window._r);window._r=setTimeout(run,200);}));
$('#sample').addEventListener('click',()=>{ $('#query').value='c1ccccc1'; $('#targets').value='CCO ethanol\nc1ccccc1O phenol\nCC(=O)Oc1ccccc1C(=O)O aspirin\nCN1C=NC2=C1C(=O)N(C(=O)N2C)C caffeine\nC1CCCCC1 cyclohexane'; run(); });
run();
</script>

</body>
</html>
