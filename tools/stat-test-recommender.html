<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistical Test Recommender — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-sitemap"></i></div><div>Statistical Test Recommender</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(96,165,250,0.12);color:var(--blue)"><i class="ti ti-sitemap"></i></div>
      <div>
        <div class="tool-title">Statistical Test Recommender</div>
        <div class="tool-desc">Answer a few questions about your data and design → the appropriate statistical test, with the non-parametric alternative.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="grid2">
      <label class="fld">Your goal<select id="goal">
        <option value="compare">Compare groups / conditions</option>
        <option value="relate">Measure a relationship between variables</option>
        <option value="predict">Predict / model an outcome</option>
        <option value="one">Compare one sample to a known value</option>
      </select></label>
      <label class="fld">Outcome (dependent) variable type<select id="dv">
        <option value="cont">Continuous (numeric)</option>
        <option value="ord">Ordinal (ranked)</option>
        <option value="cat">Categorical / counts</option>
      </select></label>
      <label class="fld" id="groupsWrap">Number of groups / conditions<select id="groups">
        <option value="2">2</option><option value="3">3 or more</option>
      </select></label>
      <label class="fld" id="pairedWrap">Design<select id="paired">
        <option value="ind">Independent (different subjects)</option>
        <option value="dep">Paired / repeated (same subjects)</option>
      </select></label>
      <label class="fld" id="normWrap">Distribution<select id="norm">
        <option value="param">Approximately normal / large n</option>
        <option value="nonparam">Skewed / small n / unsure</option>
      </select></label>
      <label class="fld" id="predWrap" style="display:none">Outcome to predict<select id="predtype">
        <option value="cont">Continuous</option><option value="binary">Binary (yes/no)</option><option value="count">Count</option>
      </select></label>
    </div>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rec{padding:16px;border-radius:12px;background:var(--bg2);border:1px solid var(--accent)}
  .rec .t{font-size:24px;font-weight:700;color:var(--accent3)}
  .rec .alt{margin-top:8px;font-size:13px;color:var(--text2)}</style>

<script>
const $ = s => document.querySelector(s);
function vis(){ const goal=$('#goal').value; const pred=goal==='predict'; const cmp=goal==='compare';
  $('#groupsWrap').style.display=cmp?'':'none'; $('#pairedWrap').style.display=cmp?'':'none';
  $('#normWrap').style.display=(goal==='compare'||goal==='one')?'':'none'; $('#predWrap').style.display=pred?'':'none';
}
function rec(){
  vis();
  const goal=$('#goal').value, dv=$('#dv').value, groups=$('#groups').value, paired=$('#paired').value, norm=$('#norm').value, predtype=$('#predtype').value;
  let test='', alt='', note='';
  if(goal==='relate'){
    if(dv==='cont'){ test=norm==='nonparam'?'Spearman rank correlation':'Pearson correlation'; alt='Pearson (parametric) ↔ Spearman (non-parametric)'; }
    else if(dv==='ord'){ test='Spearman / Kendall rank correlation'; }
    else { test="Chi-square test of independence"; alt="Use Fisher's exact test for small expected counts"; }
  } else if(goal==='predict'){
    if(predtype==='cont') test='Linear regression (OLS)';
    else if(predtype==='binary') test='Logistic regression';
    else test='Poisson / negative-binomial regression';
    alt='Add predictors as covariates; check assumptions (linearity, residuals, overdispersion).';
  } else if(goal==='one'){
    if(dv==='cont') { test=norm==='nonparam'?'One-sample Wilcoxon signed-rank test':'One-sample t-test'; alt='t-test ↔ Wilcoxon signed-rank'; }
    else test='Binomial / chi-square goodness-of-fit test';
  } else { // compare
    if(dv==='cat'){ test=paired==='dep'?(groups==='2'?"McNemar's test":"Cochran's Q test"):"Chi-square test"+(groups==='2'?" (or Fisher's exact)":''); }
    else if(dv==='ord'){ test = groups==='2' ? (paired==='dep'?'Wilcoxon signed-rank test':'Mann–Whitney U test') : (paired==='dep'?'Friedman test':'Kruskal–Wallis test'); note='Ordinal data → non-parametric tests.'; }
    else { // continuous
      if(norm==='param'){ if(groups==='2') test = paired==='dep'?'Paired t-test':'Independent-samples t-test'; else test = paired==='dep'?'Repeated-measures ANOVA':'One-way ANOVA'; alt = groups==='2'?'Non-parametric: '+(paired==='dep'?'Wilcoxon signed-rank':'Mann–Whitney U'):'Non-parametric: '+(paired==='dep'?'Friedman':'Kruskal–Wallis')+'; follow a significant ANOVA with post-hoc (Tukey).'; }
      else { if(groups==='2') test = paired==='dep'?'Wilcoxon signed-rank test':'Mann–Whitney U test'; else test = paired==='dep'?'Friedman test':'Kruskal–Wallis test'; alt='Parametric equivalent assumes normality (t-test / ANOVA).'; }
    }
  }
  $('#out').innerHTML=`<div class="rec"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)">Recommended test</div>
    <div class="t">${test}</div>
    ${alt?`<div class="alt"><i class="ti ti-arrows-left-right"></i> ${alt}</div>`:''}
    ${note?`<div class="alt">${note}</div>`:''}</div>
    <div class="muted" style="font-size:12px;margin-top:8px">Guidance only — always check the test's assumptions (independence, normality, equal variances, expected cell counts) before reporting.</div>`;
}
document.querySelectorAll('#goal,#dv,#groups,#paired,#norm,#predtype').forEach(el=>el.addEventListener('change',rec));
rec();
</script>

</body>
</html>
