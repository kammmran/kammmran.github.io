<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Process Mapper — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-map-2"></i></div><div>Research Process Mapper</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1000px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(45,212,191,0.12);color:var(--teal)"><i class="ti ti-map-2"></i></div>
      <div>
        <div class="tool-title">Research Process Mapper</div>
        <div class="tool-desc">Map a research process as a sequence of phases, each with its key activities and outputs underneath. A high-level "process map" view (as opposed to a step-by-step flowchart) for proposals, SOPs and onboarding docs. Export SVG/PNG. Local.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Phases &amp; activities — a <code>#</code> line starts a phase; lines below it are its activities.
      <textarea id="src" style="min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px"># Discover
Literature review
Define research question
Pre-registration
# Design
Choose methods
Power analysis
Ethics approval
# Collect
Recruit / sample
Run experiments
Quality control
# Analyze
Statistical modelling
Robustness checks
# Disseminate
Write manuscript
Submit & revise
Open data release</textarea>
    </label>
    <div class="row" style="gap:12px;flex-wrap:wrap;font-size:12px">
      <label class="fld">Theme<select id="theme"><option value="#0d4f4a">Teal</option><option value="#0b2545">Navy</option><option value="#5e1322">Maroon</option><option value="#3b2a5e">Purple</option></select></label>
    </div>
    <div style="overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff"><div id="chart"></div></div>
    <div class="row"><button class="btn" id="svg"><i class="ti ti-download"></i> SVG</button><button class="btn" id="png"><i class="ti ti-photo-down"></i> PNG</button><span class="muted" id="status" style="font-size:12px;margin-left:auto"></span></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:11.5px}</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let lastSVG='';
function parse(){const phases=[];let cur=null;$('#src').value.split('\n').forEach(l=>{const t=l.trim();if(t.startsWith('# ')){cur={name:t.slice(2).trim(),acts:[]};phases.push(cur);}else if(t&&cur)cur.acts.push(t);});return phases;}
function shade(hex,light){const n=parseInt(hex.slice(1),16);const r=(n>>16),g=(n>>8)&255,b=n&255;const m=(v)=>Math.round(v+(255-v)*light);return `rgb(${m(r)},${m(g)},${m(b)})`;}
function render(){
  const phases=parse();if(!phases.length){$('#status').textContent='Add phases with # headings.';return;}
  const base=$('#theme').value;
  const cw=200,gap=30,padT=70,headH=56;const maxActs=Math.max(...phases.map(p=>p.acts.length));
  const actH=40,bodyH=maxActs*actH+10;const W=phases.length*cw+(phases.length-1)*gap+60,H=padT+headH+bodyH+50;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" font-family="Arial,sans-serif"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${base}"/></marker></defs><text x="${W/2}" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="${base}">Research Process</text>`;
  phases.forEach((p,i)=>{
    const x=30+i*(cw+gap),y=padT;
    // chevron header
    const ar=18;
    svg+=`<path d="M${x},${y} L${x+cw-ar},${y} L${x+cw},${y+headH/2} L${x+cw-ar},${y+headH} L${x},${y+headH} L${x+ar},${y+headH/2} Z" fill="${base}"/>`;
    svg+=`<text x="${x+cw/2+8}" y="${y+headH/2+5}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">${i+1}. ${esc(p.name)}</text>`;
    // body card
    svg+=`<rect x="${x}" y="${y+headH+8}" width="${cw}" height="${bodyH}" rx="10" fill="${shade(base,0.9)}" stroke="${base}" stroke-width="1.5"/>`;
    p.acts.forEach((a,j)=>{const ay=y+headH+8+14+j*actH;svg+=`<circle cx="${x+16}" cy="${ay+4}" r="4" fill="${base}"/><text x="${x+30}" y="${ay+8}" font-size="13" fill="#222">${esc(a.length>26?a.slice(0,25)+'…':a)}</text>`;});
    if(i<phases.length-1){const ax=x+cw+4;svg+=`<line x1="${ax}" y1="${y+headH/2}" x2="${ax+gap-8}" y2="${y+headH/2}" stroke="${base}" stroke-width="3" marker-end="url(#a)"/>`;}
  });
  svg+='</svg>';lastSVG=svg;$('#chart').innerHTML=svg;$('#status').textContent=phases.length+' phases';
}
['src','theme'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#svg').onclick=()=>{const b=new Blob([lastSVG],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='process-map.svg';a.click();};
$('#png').onclick=()=>{const b=new Blob([lastSVG],{type:'image/svg+xml'});const url=URL.createObjectURL(b);const img=new Image();img.onload=()=>{const m=lastSVG.match(/width="(\d+)" height="(\d+)"/);const c=document.createElement('canvas');c.width=m[1]*2;c.height=m[2]*2;const cx=c.getContext('2d');cx.scale(2,2);cx.fillStyle='#fff';cx.fillRect(0,0,+m[1],+m[2]);cx.drawImage(img,0,0);c.toBlob(bb=>{const a=document.createElement('a');a.href=URL.createObjectURL(bb);a.download='process-map.png';a.click();});};img.src=url;};
render();
</script>
</body>
</html>
