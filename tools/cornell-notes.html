<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cornell Notes — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar no-print">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-notebook"></i></div><div>Cornell Notes</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1100px">
  <div class="tool-header no-print">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(45,212,191,0.12);color:var(--teal)"><i class="ti ti-notebook"></i></div>
      <div>
        <div class="tool-title">Cornell Notes</div>
        <div class="tool-desc">Cues · Notes · Summary. Save drafts locally, print or export as HTML.</div>
      </div>
    </div>
  </div>

  <div class="row no-print" style="margin-bottom:12px; gap:10px">
    <label class="row" style="gap:6px; font-size:13px; color:var(--text2)">
      Draft
      <select id="draft-sel"></select>
    </label>
    <button class="btn btn-sm" id="new-btn"><i class="ti ti-plus"></i> New draft</button>
    <button class="btn btn-sm" id="dup-btn"><i class="ti ti-copy"></i> Duplicate</button>
    <button class="btn btn-sm" id="del-btn" style="color:var(--red)"><i class="ti ti-trash"></i> Delete</button>
    <span class="spacer"></span>
    <button class="btn btn-sm" id="print-btn"><i class="ti ti-printer"></i> Print / PDF</button>
    <button class="btn btn-sm" id="export-btn"><i class="ti ti-download"></i> Export HTML</button>
  </div>

  <div class="note-sheet">
    <div class="note-head row no-print" style="gap:10px; padding:14px">
      <input type="text" id="title" placeholder="Topic / class" style="flex:2; font-size:18px; font-weight:600; background:transparent; border:none; padding:6px">
      <input type="text" id="course" placeholder="Course" style="flex:1; background:transparent; border:none; padding:6px">
      <input type="date" id="date" style="width:160px; background:transparent; border:none; padding:6px">
    </div>
    <div class="note-head-print" style="display:none">
      <h1 id="p-title"></h1>
      <div><span id="p-course"></span> · <span id="p-date"></span></div>
    </div>
    <div class="note-grid">
      <div class="note-cues">
        <div class="note-label">Cues / Questions</div>
        <textarea id="cues" placeholder="Key questions, terms, prompts…"></textarea>
      </div>
      <div class="note-main">
        <div class="note-label">Notes</div>
        <textarea id="notes" placeholder="Main notes from lecture, reading, or meeting…"></textarea>
      </div>
    </div>
    <div class="note-summary">
      <div class="note-label">Summary</div>
      <textarea id="summary" placeholder="2–3 sentences summing up the page in your own words."></textarea>
    </div>
  </div>

  <div class="muted no-print" style="margin-top:10px; font-size:12px"><i class="ti ti-info-circle"></i> Drafts autosave as you type. Use <b>Print</b> to save as PDF via your browser's print dialog.</div>
</main>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Done</span></div>

<style>
.note-sheet { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.note-grid { display: grid; grid-template-columns: 30% 70%; border-top: 1px solid var(--border); }
.note-cues, .note-main { padding: 14px; }
.note-cues { border-right: 1px solid var(--border); background: var(--bg2); }
.note-summary { padding: 14px; border-top: 1px solid var(--border); background: var(--bg2); }
.note-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
.note-sheet textarea { background: transparent !important; border: none !important; padding: 4px !important; min-height: 200px; resize: vertical; font-family: -apple-system, sans-serif !important; font-size: 15px !important; line-height: 1.6 !important; }
.note-summary textarea { min-height: 90px; }
.note-sheet textarea:focus { outline: none; }
@media (max-width: 700px) { .note-grid { grid-template-columns: 1fr; } .note-cues { border-right: none; border-bottom: 1px solid var(--border); } }

@media print {
  body { background: white !important; color: black !important; }
  .no-print { display: none !important; }
  .note-head-print { display: block !important; padding: 0 0 16px; border-bottom: 2px solid #333; margin-bottom: 16px; }
  .note-head-print h1 { font-size: 24px; margin-bottom: 6px; }
  .note-head-print div { font-size: 13px; color: #555; }
  .note-sheet { background: white !important; border: none !important; }
  .note-grid { border-top-color: #333; }
  .note-cues, .note-main, .note-summary { background: white !important; color: black !important; }
  .note-cues { border-right-color: #333 !important; }
  .note-summary { border-top: 2px solid #333; }
  .note-label { color: #555 !important; }
  .note-sheet textarea { color: black !important; }
  @page { margin: 1cm; }
}
</style>

<script>
const $ = s => document.querySelector(s);
const STORE = 'cornell-v1';

let state = JSON.parse(localStorage.getItem(STORE) || 'null') || { drafts: {}, active: null };
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
function toast(m) { const t = $('#toast'); $('#toast-msg').textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
function uid() { return Math.random().toString(36).slice(2, 10); }

function ensureActive() {
  if (!state.active || !state.drafts[state.active]) {
    const id = uid();
    state.drafts[id] = { title: '', course: '', date: new Date().toISOString().slice(0,10), cues: '', notes: '', summary: '', updated: Date.now() };
    state.active = id;
    save();
  }
}

function loadDraft() {
  const d = state.drafts[state.active];
  $('#title').value = d.title;
  $('#course').value = d.course;
  $('#date').value = d.date;
  $('#cues').value = d.cues;
  $('#notes').value = d.notes;
  $('#summary').value = d.summary;
  $('#p-title').textContent = d.title || 'Untitled';
  $('#p-course').textContent = d.course || '';
  $('#p-date').textContent = d.date || '';
}

function renderDraftSelect() {
  const sel = $('#draft-sel');
  sel.innerHTML = '';
  const ids = Object.keys(state.drafts).sort((a,b) => (state.drafts[b].updated||0) - (state.drafts[a].updated||0));
  ids.forEach(id => {
    const d = state.drafts[id];
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = (d.title || '(untitled)') + (d.date ? ` — ${d.date}` : '');
    if (id === state.active) opt.selected = true;
    sel.appendChild(opt);
  });
}

function update(field, val) {
  state.drafts[state.active][field] = val;
  state.drafts[state.active].updated = Date.now();
  save();
  if (field === 'title') $('#p-title').textContent = val || 'Untitled';
  if (field === 'course') $('#p-course').textContent = val;
  if (field === 'date') $('#p-date').textContent = val;
  renderDraftSelect();
}

['title','course','date','cues','notes','summary'].forEach(f => {
  $('#' + f).addEventListener('input', () => update(f, $('#' + f).value));
});

$('#draft-sel').addEventListener('change', () => { state.active = $('#draft-sel').value; save(); loadDraft(); });
$('#new-btn').addEventListener('click', () => {
  const id = uid();
  state.drafts[id] = { title: '', course: '', date: new Date().toISOString().slice(0,10), cues: '', notes: '', summary: '', updated: Date.now() };
  state.active = id;
  save(); renderDraftSelect(); loadDraft();
  $('#title').focus();
});
$('#dup-btn').addEventListener('click', () => {
  const d = state.drafts[state.active];
  const id = uid();
  state.drafts[id] = { ...d, title: (d.title || 'Untitled') + ' (copy)', updated: Date.now() };
  state.active = id;
  save(); renderDraftSelect(); loadDraft();
});
$('#del-btn').addEventListener('click', () => {
  if (!confirm('Delete this draft?')) return;
  delete state.drafts[state.active];
  state.active = null;
  ensureActive();
  save(); renderDraftSelect(); loadDraft();
});
$('#print-btn').addEventListener('click', () => window.print());
$('#export-btn').addEventListener('click', () => {
  const d = state.drafts[state.active];
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(d.title || 'Cornell Notes')}</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:800px;margin:2cm auto;padding:0 20px;color:#222}
h1{font-size:24px;margin-bottom:6px}
.meta{color:#666;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:30% 70%;border:1px solid #333}
.cues,.main{padding:14px;min-height:300px;white-space:pre-wrap}
.cues{border-right:1px solid #333;background:#f7f7f7}
.summary{padding:14px;border:1px solid #333;border-top:none;background:#f7f7f7;white-space:pre-wrap}
.lbl{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
</style></head><body>
<h1>${escapeHtml(d.title || 'Untitled')}</h1>
<div class="meta">${escapeHtml(d.course || '')} · ${escapeHtml(d.date || '')}</div>
<div class="grid">
  <div class="cues"><div class="lbl">Cues</div>${escapeHtml(d.cues)}</div>
  <div class="main"><div class="lbl">Notes</div>${escapeHtml(d.notes)}</div>
</div>
<div class="summary"><div class="lbl">Summary</div>${escapeHtml(d.summary)}</div>
</body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (d.title || 'cornell-notes').replace(/[^a-z0-9]/gi, '_') + '.html';
  a.click();
  toast('Exported');
});

function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }

ensureActive();
renderDraftSelect();
loadDraft();
</script>

</body>
</html>
