<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photon Energy — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-wave-saw-tool"></i></div><div>Photon Energy</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-wave-saw-tool"></i></div>
      <div>
        <div class="tool-title">Photon Energy ↔ Wavelength</div>
        <div class="tool-desc">E = hν = hc/λ. Enter any one of wavelength, frequency or energy — the others update instantly.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto">
    <div class="grid2">
      <label class="fld">Wavelength λ (nm)<input type="number" id="wl" step="any"></label>
      <label class="fld">Frequency ν (THz)<input type="number" id="freq" step="any"></label>
      <label class="fld">Energy (eV)<input type="number" id="ev" step="any"></label>
      <label class="fld">Energy (J)<input type="number" id="j" step="any"></label>
    </div>
    <div id="band" class="spectrum"></div>
    <div id="out" class="output-box" style="min-height:auto;margin-top:14px"></div>
  </div>
</main>

<style>
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
  .spectrum{height:24px;border-radius:6px;margin:18px 0 4px;position:relative;background:linear-gradient(90deg,#7c3aed 0%,#3b82f6 20%,#22c55e 40%,#fbbf24 60%,#f97316 75%,#e11d48 100%)}
  .sp-marker{position:absolute;top:-5px;width:3px;height:34px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(0,0,0,.6)}
</style>

<script>
const $ = s => document.querySelector(s);
const num = id => { const v=parseFloat($('#'+id).value); return Number.isFinite(v)&&v>0?v:null; };
const h=6.62607015e-34, c=2.99792458e8, eV=1.602176634e-19, NA=6.02214076e23;
let lock=false;

function fromEnergyJ(E){
  const freqHz=E/h; const wlM=c/freqHz;
  set('wl', wlM*1e9); set('freq', freqHz/1e12); set('ev', E/eV); set('j', E);
  show(wlM*1e9, freqHz, E);
}
function set(id,v){ if(document.activeElement!==$('#'+id)) $('#'+id).value=v.toPrecision(6).replace(/\.?0+$/,''); }

function show(wlnm, freqHz, EJ){
  const molar=EJ*NA/1000; // kJ/mol
  let region='';
  if(wlnm<10) region='X-ray / γ'; else if(wlnm<400) region='ultraviolet'; else if(wlnm<=700) region='visible'; else if(wlnm<1e6) region='infrared'; else if(wlnm<1e9) region='microwave'; else region='radio';
  $('#out').innerHTML=`Region: <b>${region}</b> · ${(EJ/eV).toPrecision(4)} eV · ${molar.toPrecision(4)} kJ/mol`;
  const band=$('#band'); band.querySelectorAll('.sp-marker').forEach(m=>m.remove());
  if(wlnm>=380&&wlnm<=750){ const p=(750-wlnm)/(750-380)*100; const m=document.createElement('div'); m.className='sp-marker'; m.style.left=`calc(${p}% - 1.5px)`; band.appendChild(m); }
}

function handler(src){
  if(lock) return; lock=true;
  let E=null;
  const wl=num('wl'),freq=num('freq'),ev=num('ev'),j=num('j');
  if(src==='wl'&&wl){ E=h*c/(wl*1e-9); }
  else if(src==='freq'&&freq){ E=h*(freq*1e12); }
  else if(src==='ev'&&ev){ E=ev*eV; }
  else if(src==='j'&&j){ E=j; }
  if(E){ fromEnergyJ(E); } else { $('#out').innerHTML='<span class="muted">Enter a positive value.</span>'; }
  lock=false;
}
['wl','freq','ev','j'].forEach(id=>$('#'+id).addEventListener('input',()=>handler(id)));
</script>

</body>
</html>
