<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literature Review Agent - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-robot"></i></div><div>Literature Review Agent</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:900px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(45,212,191,0.12);color:var(--teal)"><i class="ti ti-robot"></i></div>
      <div>
        <div class="tool-title">Literature Review Agent</div>
        <div class="tool-desc">Paste several abstracts → it clusters them into themes, pulls a one-line takeaway from each, and assembles a review skeleton. Extractive &amp; offline (no hallucination).</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Paste abstracts - separate each paper with a blank line or <code>---</code> (optionally start a paper with "Author (Year):")
      <textarea id="txt" style="min-height:180px" placeholder="Smith (2020): Abstract text of paper one…&#10;---&#10;Lee (2021): Abstract text of paper two…"></textarea>
    </label>
    <div class="row"><button class="btn btn-primary" id="run"><i class="ti ti-wand"></i> Synthesize</button><button class="btn" id="copy"><i class="ti ti-copy"></i> Copy</button></div>
    <div id="out" class="output-box" style="min-height:auto;white-space:normal"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  #out h3{font-size:14px;margin:14px 0 6px;color:var(--accent3)}
  #out h4{font-size:13px;margin:10px 0 4px}
  #out ul{margin:4px 0;padding-left:18px}#out li{font-size:13px;margin-bottom:4px}
  #out .take{color:var(--text2)}#out .src{color:var(--teal);font-weight:600}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STOP=new Set('the a an and or but of to in on for with as by at from is are was were be been this that these those it its their our we they not no using used based study studies paper research method models data results approach show shown found between among more most than then also which such these can may will however therefore'.split(' '));
function tf(t){ const m={}; (t.toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[]).forEach(w=>{ if(!STOP.has(w))m[w]=(m[w]||0)+1; }); return m; }
function cosine(a,b){ let dot=0,na=0,nb=0; for(const k in a){na+=a[k]*a[k]; if(b[k])dot+=a[k]*b[k];} for(const k in b)nb+=b[k]*b[k]; return (na&&nb)?dot/Math.sqrt(na*nb):0; }
function sentences(t){ return (t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(s=>s.split(' ').length>=5); }
function takeaway(t){ const sents=sentences(t); if(!sents.length) return t.slice(0,140); const f={}; sents.forEach(s=>s.toLowerCase().match(/[a-z]{4,}/g)?.forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1;})); let best=sents[0],bs=-1; sents.forEach(s=>{ if(/\b(we (found|show|propose)|results?|conclude|demonstrate|significant|key)\b/i.test(s)){ let sc=0;(s.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>sc+=f[w]||0); if(sc>bs){bs=sc;best=s;} } }); return best; }

$('#run').addEventListener('click',()=>{
  const raw=$('#txt').value.trim(); const out=$('#out');
  const papers=raw.split(/\n\s*---+\s*\n|\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>30);
  if(papers.length<2){ out.innerHTML='<div class="muted">Paste at least two abstracts (separate with a blank line or ---).</div>'; return; }
  const docs=papers.map((p,i)=>{ const m=p.match(/^([A-Z][^:]{0,40}\(\d{4}[a-z]?\))\s*:?\s*/); const label=m?m[1]:`Paper ${i+1}`; const body=m?p.slice(m[0].length):p; return {label,body,vec:tf(body),take:takeaway(body)}; });
  // greedy clustering by cosine similarity
  const used=new Array(docs.length).fill(false); const clusters=[];
  for(let i=0;i<docs.length;i++){ if(used[i])continue; const cl=[i]; used[i]=true; for(let j=i+1;j<docs.length;j++){ if(used[j])continue; if(cosine(docs[i].vec,docs[j].vec)>=0.12){ cl.push(j); used[j]=true; } } clusters.push(cl); }
  // theme label per cluster = top shared term
  let html=`<h3>Auto-synthesised review skeleton</h3><div class="muted" style="font-size:12px">${docs.length} papers → ${clusters.length} theme${clusters.length>1?'s':''}.</div>`;
  clusters.forEach((cl,ci)=>{ const merged={}; cl.forEach(i=>{ for(const k in docs[i].vec) merged[k]=(merged[k]||0)+docs[i].vec[k]; }); const theme=Object.entries(merged).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(', ')||'theme';
    html+=`<h4>Theme ${ci+1}: ${esc(theme)}</h4><ul>${cl.map(i=>`<li><span class="src">${esc(docs[i].label)}:</span> <span class="take">${esc(docs[i].take)}</span></li>`).join('')}</ul>`; });
  html+=`<h3>Synthesis prompts</h3><ul>
    <li>Within each theme, where do the papers <b>agree</b>, and where do they <b>conflict</b>?</li>
    <li>What methods recur across themes, and which are unique?</li>
    <li>What gap cuts across all themes - and how does your work address it?</li></ul>`;
  out.innerHTML=html;
});
$('#copy').addEventListener('click',()=>{ const t=$('#out').innerText.trim(); if(t){navigator.clipboard.writeText(t); const b=$('#copy'); b.innerHTML='<i class="ti ti-check"></i> Copied'; setTimeout(()=>b.innerHTML='<i class="ti ti-copy"></i> Copy',1400);} });
</script>

</body>
</html>
