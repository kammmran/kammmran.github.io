<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase Diagram — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-chart-dots-2"></i></div><div>Phase Diagram</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(45,212,191,0.12);color:var(--teal)"><i class="ti ti-chart-dots-2"></i></div>
      <div>
        <div class="tool-title">Phase Diagram Explorer</div>
        <div class="tool-desc">Interactive P–T diagram for water or CO₂ — move the point or type P and T to see which phase the substance is in.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row">
      <label class="fld">Substance<select id="sub"><option value="water">Water (H₂O)</option><option value="co2">Carbon dioxide (CO₂)</option></select></label>
      <label class="fld">Temperature (K)<input type="number" id="t" step="any"></label>
      <label class="fld">Pressure (atm)<input type="number" id="p" step="any"></label>
    </div>
    <svg id="svg" viewBox="0 0 760 420" style="width:100%;height:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;cursor:crosshair"></svg>
    <div id="info"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  svg text{fill:var(--text2);font-size:12px}</style>

<script>
const $ = s => document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
// Data: triple point, critical point, normal melting/boiling. Pressures in atm, T in K.
// We render on a log-pressure axis. Phase boundaries approximated for teaching.
const DATA={
  water:{ name:'Water', triple:[273.16,0.006], crit:[647,218], melt:[273.15,1], boil:[373.15,1],
          Tmin:200, Tmax:700, Pmin:1e-3, Pmax:300, negSlope:true },
  co2:{ name:'CO₂', triple:[216.6,5.11], crit:[304.2,72.8], sub:[194.7,1], melt:[216.6,5.11],
        Tmin:150, Tmax:340, Pmin:0.1, Pmax:120, negSlope:false },
};

let cur, X, Y;
function setup(){
  cur=DATA[$('#sub').value];
  if(!$('#t').value){ $('#t').value=cur.name==='Water'?300:230; $('#p').value=1; }
}

function phaseOf(T,P){
  const d=cur; const [Tt,Pt]=d.triple; const [Tc,Pc]=d.crit;
  if(T>=Tc && P>=Pc) return 'Supercritical fluid';
  // sublimation curve (solid/gas) below triple point: rough exponential
  const subP = t => Pt*Math.exp(12*(1/Tt-1/t)*Tt);           // grows with T toward triple
  // vaporization curve (liquid/gas): monotone interpolation in log-P between triple and critical
  const boilP = t => { const f=(1/Tt-1/t)/(1/Tt-1/Tc); return Pt*Math.pow(Pc/Pt, Math.max(0,Math.min(1,f))); };
  // melting line: nearly vertical; water slopes slightly left (negative), CO2 slightly right
  const meltT = p => { const Tm=d.triple[0]; const slope=d.negSlope? -0.0009 : 0.0008; return Tm + slope*(p-Pt); };
  if(T<Tt){
    // solid or gas, divided by sublimation curve
    return P > subP(T) ? 'Solid' : 'Gas';
  } else {
    const meltLineT = meltT(P);
    if(T < meltLineT && P > Pt) return 'Solid';
    const bp=boilP(T);
    if(P > bp) return (T>=Tc?'Supercritical fluid':'Liquid');
    return 'Gas';
  }
}

function render(){
  setup();
  const d=cur, svg=$('#svg'); svg.innerHTML='';
  const W=760,H=420,pl=58,pr=24,pt=20,pb=42,iw=W-pl-pr,ih=H-pt-pb;
  const lP=Math.log10(d.Pmin), hP=Math.log10(d.Pmax);
  X=T=>pl+(T-d.Tmin)/(d.Tmax-d.Tmin)*iw;
  Y=P=>pt+(hP-Math.log10(P))/(hP-lP)*ih;
  const Xinv=px=>d.Tmin+(px-pl)/iw*(d.Tmax-d.Tmin);
  const Yinv=py=>Math.pow(10, hP-(py-pt)/ih*(hP-lP));
  // shade regions by sampling a grid
  const cols={Solid:'rgba(96,165,250,0.16)',Liquid:'rgba(45,212,191,0.18)',Gas:'rgba(251,191,36,0.14)','Supercritical fluid':'rgba(124,109,240,0.16)'};
  const step=10;
  for(let px=pl;px<W-pr;px+=step){ for(let py=pt;py<H-pb;py+=step){ const ph=phaseOf(Xinv(px+step/2),Yinv(py+step/2)); const r=document.createElementNS(NS,'rect'); r.setAttribute('x',px);r.setAttribute('y',py);r.setAttribute('width',step);r.setAttribute('height',step);r.setAttribute('fill',cols[ph]||'transparent'); svg.appendChild(r); } }
  // axes
  const ln=(x1,y1,x2,y2,c,dash)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',c);l.setAttribute('stroke-width','1.2');if(dash)l.setAttribute('stroke-dasharray',dash);svg.appendChild(l);};
  const tx=(x,y,s,a,fill,sz)=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',a||'middle');if(fill)t.setAttribute('fill',fill);if(sz)t.setAttribute('font-size',sz);t.textContent=s;svg.appendChild(t);};
  ln(pl,pt,pl,H-pb,'var(--border2)'); ln(pl,H-pb,W-pr,H-pb,'var(--border2)');
  for(let k=0;k<=5;k++){ const T=d.Tmin+(d.Tmax-d.Tmin)*k/5; ln(X(T),H-pb,X(T),H-pb+4,'var(--border2)'); tx(X(T),H-pb+16,Math.round(T),'middle','var(--text3)',11); }
  for(let e=Math.ceil(lP);e<=Math.floor(hP);e++){ const P=Math.pow(10,e); ln(pl-4,Y(P),pl,Y(P),'var(--border2)'); tx(pl-7,Y(P)+3,P>=1?P:P.toExponential(0),'end','var(--text3)',10); ln(pl,Y(P),W-pr,Y(P),'var(--border)',''); }
  tx(pl+iw/2,H-4,'Temperature (K)','middle','var(--text3)',12);
  tx(16,pt+ih/2,'Pressure (atm, log)','middle','var(--text3)',12).setAttribute('transform',`rotate(-90 16 ${pt+ih/2})`);
  // region labels
  tx(X(d.Tmin+(d.triple[0]-d.Tmin)*0.4),Y(d.Pmax*0.3),'SOLID','middle','var(--blue)',13);
  tx(X((d.triple[0]+d.crit[0])/2),Y(d.crit[1]*0.5),'LIQUID','middle','var(--teal)',13);
  tx(X(d.Tmax*0.93),Y(d.Pmin*5),'GAS','middle','var(--amber)',13);
  if(d.crit[0]<d.Tmax) tx(X((d.crit[0]+d.Tmax)/2),Y(d.crit[1]*2),'SUPERCRITICAL','middle','var(--accent3)',11);
  // key points
  const dot=(T,P,c,label,dy)=>{ const cc=document.createElementNS(NS,'circle');cc.setAttribute('cx',X(T));cc.setAttribute('cy',Y(P));cc.setAttribute('r',5);cc.setAttribute('fill',c);cc.setAttribute('stroke','var(--bg)');cc.setAttribute('stroke-width','1.5');svg.appendChild(cc); tx(X(T)+8,Y(P)+(dy||4),label,'start','var(--text2)',10); };
  dot(d.triple[0],d.triple[1],'var(--text)','triple pt');
  dot(d.crit[0],d.crit[1],'var(--accent3)','critical pt',-8);
  // current point
  const T=+$('#t').value, P=+$('#p').value;
  if(T>0&&P>0){ const cx=Math.max(pl,Math.min(W-pr,X(T))), cy=Math.max(pt,Math.min(H-pb,Y(P)));
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',7);c.setAttribute('fill','var(--red)');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','2');svg.appendChild(c);
    const ph=phaseOf(T,P);
    $('#info').innerHTML=`<div class="stat-grid"><div class="stat-card"><div class="stat-label">At ${T} K, ${P} atm</div><div class="stat-value" style="color:var(--red)">${ph}</div></div>
      <div class="stat-card"><div class="stat-label">Triple point</div><div class="stat-value" style="font-size:13px">${d.triple[0]} K · ${d.triple[1]} atm</div></div>
      <div class="stat-card"><div class="stat-label">Critical point</div><div class="stat-value" style="font-size:13px">${d.crit[0]} K · ${d.crit[1]} atm</div></div></div>
      <div class="muted" style="font-size:12px;margin-top:8px">Click anywhere on the diagram to move the point. ${d.negSlope?'Water\'s solid–liquid line slopes slightly left — ice is less dense than liquid water.':'CO₂ has no liquid phase at 1 atm: it sublimes directly from solid to gas.'} Boundaries are schematic.</div>`;
  }
}
$('#svg').addEventListener('click',e=>{
  const r=$('#svg').getBoundingClientRect(); const sx=760/r.width, sy=420/r.height;
  const px=(e.clientX-r.left)*sx, py=(e.clientY-r.top)*sy;
  const d=cur, pl=58,pr=24,pt=20,pb=42,iw=760-pl-pr,ih=420-pt-pb;
  const lP=Math.log10(d.Pmin), hP=Math.log10(d.Pmax);
  const T=d.Tmin+(px-pl)/iw*(d.Tmax-d.Tmin); const P=Math.pow(10,hP-(py-pt)/ih*(hP-lP));
  if(T>0&&P>0){ $('#t').value=Math.round(T*10)/10; $('#p').value=+P.toPrecision(3); render(); }
});
['sub','t','p'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#sub').addEventListener('change',()=>{ $('#t').value=''; $('#p').value=''; render(); });
render();
</script>

</body>
</html>
