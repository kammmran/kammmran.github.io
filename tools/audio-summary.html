<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Summary Generator - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-file-text"></i></div><div>Audio Summary Generator</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:900px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(251,191,36,0.12);color:var(--amber)"><i class="ti ti-file-text"></i></div>
      <div>
        <div class="tool-title">Audio Summary Generator</div>
        <div class="tool-desc">Condense a long recording's transcript into a concise summary. An extractive TextRank-style algorithm scores and selects the most central sentences, plus pulls out key bullet points - fully in your browser, no upload.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Transcript / long text
      <textarea id="txt" style="min-height:160px" placeholder="Paste a transcript or any long text…"></textarea>
    </label>
    <div class="row" style="gap:10px">
      <button class="btn btn-primary" id="run"><i class="ti ti-wand"></i> Summarize</button>
      <label class="fld" style="flex-direction:row;align-items:center;gap:6px">Length <input type="range" id="len" min="10" max="50" value="25"><span id="lenV" class="muted" style="font-size:12px">25%</span></label>
      <button class="btn" id="copy"><i class="ti ti-copy"></i> Copy</button>
      <span class="muted" id="status" style="font-size:12px;margin-left:auto"></span>
    </div>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .summary{border:1px solid var(--border);border-radius:8px;background:var(--bg2);padding:14px;font-size:14px;line-height:1.7}
  .bullets{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--text2)}</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STOP=new Set('the a an and or but of to in on at for with as is are was were be been it its they them he she you we i my me do did so this that these those not no yes just very more most some any all can could would should will from by about into over their there here what when how also only your our'.split(' '));
$('#len').oninput=()=>$('#lenV').textContent=$('#len').value+'%';
let summaryText='';
function sentences(t){return (t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+/g)||[]).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=4);}
function tokens(s){return (s.toLowerCase().match(/\b[a-z][a-z'-]{2,}\b/g)||[]).filter(w=>!STOP.has(w));}
$('#run').onclick=()=>{
  const raw=$('#txt').value.replace(/^[A-Z][\w .]{0,28}:/gm,'').trim();
  const sents=sentences(raw);
  if(sents.length<3){$('#status').textContent='Need at least a few sentences.';return;}
  const toks=sents.map(tokens);
  const df={};toks.forEach(t=>new Set(t).forEach(w=>df[w]=(df[w]||0)+1));
  const N=sents.length;
  const vecs=toks.map(t=>{const v={};t.forEach(w=>{v[w]=(v[w]||0)+1;});Object.keys(v).forEach(w=>v[w]*=Math.log(N/(df[w]||1)));return v;});
  function sim(a,b){let dot=0,na=0,nb=0;for(const k in a){na+=a[k]*a[k];if(b[k])dot+=a[k]*b[k];}for(const k in b)nb+=b[k]*b[k];return (na&&nb)?dot/Math.sqrt(na*nb):0;}
  let scores=new Array(N).fill(1);
  const M=vecs.map((v,i)=>vecs.map((w,j)=>i===j?0:sim(v,w)));
  for(let it=0;it<30;it++){const ns=new Array(N).fill(0.15);for(let i=0;i<N;i++){let s=0;for(let j=0;j<N;j++){if(i===j)continue;const out=M[j].reduce((a,b)=>a+b,0);if(out)s+=M[j][i]/out*scores[j];}ns[i]+=0.85*s;}scores=ns;}
  const pct=+$('#len').value/100;const k=Math.max(1,Math.round(N*pct));
  const ranked=scores.map((s,i)=>[i,s]).sort((a,b)=>b[1]-a[1]).slice(0,k).map(x=>x[0]).sort((a,b)=>a-b);
  summaryText=ranked.map(i=>sents[i]).join(' ');
  // key bullets = top distinct sentences
  const bullets=scores.map((s,i)=>[i,s]).sort((a,b)=>b[1]-a[1]).slice(0,Math.min(5,Math.ceil(k/2))).sort((a,b)=>a[0]-b[0]).map(x=>sents[x[0]]);
  $('#out').innerHTML=`<div class="summary">${esc(summaryText)}<ul class="bullets">${bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Reduced ${N} sentences → ${k} (${Math.round(k/N*100)}%). Extractive summary - sentences are taken verbatim from your transcript.</div>`;
  $('#status').textContent='Summarized';
};
$('#copy').onclick=()=>{if(summaryText){navigator.clipboard.writeText(summaryText);$('#status').textContent='Copied.';}};
</script>
</body>
</html>
