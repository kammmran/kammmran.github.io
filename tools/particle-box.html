<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle in a Box — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-wave-sine"></i></div><div>Particle in a Box</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-wave-sine"></i></div>
      <div>
        <div class="tool-title">Particle in a 1-D Box</div>
        <div class="tool-desc">Energy levels Eₙ = n²h²/8mL², the wavefunction ψₙ and probability density |ψₙ|² for the infinite square well.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="grid3">
      <label class="fld">Quantum number n<input type="number" id="n" value="1" min="1" max="12" step="1"></label>
      <label class="fld">Box length L (nm)<input type="number" id="L" value="1" min="0.01" step="any"></label>
      <label class="fld">Particle<select id="mass"><option value="9.109e-31">Electron</option><option value="1.673e-27">Proton</option><option value="6.646e-27">He atom</option></select></label>
    </div>
    <svg id="svg" viewBox="0 0 760 320" style="width:100%;height:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px"></svg>
    <div class="row"><label class="fld" style="flex-direction:row;align-items:center;gap:7px"><input type="checkbox" id="prob" style="width:16px;height:16px"> Show |ψ|² (probability density)</label></div>
    <div id="info"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  svg text{fill:var(--text3);font-size:11px}</style>

<script>
const $ = s => document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const h=6.626e-34, eV=1.602e-19;

function run(){
  const n=Math.max(1,Math.min(12,Math.round(+$('#n').value||1)));
  const Lnm=+$('#L').value; const L=Lnm*1e-9; const m=+$('#mass').value;
  const E=n*n*h*h/(8*m*L*L);                 // Joules
  const EeV=E/eV;
  const svg=$('#svg'); svg.innerHTML='';
  const W=760,H=320,pl=40,pr=24,pt=20,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  const prob=$('#prob').checked;
  const X=x=>pl+x*iw, mid=pt+ih/2;
  // box walls
  const wall=(x)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x);l.setAttribute('y1',pt);l.setAttribute('x2',x);l.setAttribute('y2',pt+ih);l.setAttribute('stroke','var(--border2)');l.setAttribute('stroke-width','3');svg.appendChild(l);};
  wall(pl); wall(pl+iw);
  const base=document.createElementNS(NS,'line'); base.setAttribute('x1',pl);base.setAttribute('y1',prob?pt+ih-6:mid);base.setAttribute('x2',pl+iw);base.setAttribute('y2',prob?pt+ih-6:mid);base.setAttribute('stroke','var(--border)');base.setAttribute('stroke-dasharray','3 3');svg.appendChild(base);
  // wavefunction: ψ = sqrt(2)*sin(nπx)  (x in 0..1, amplitude normalized to view)
  const amp=ih*0.42;
  let d=''; const Npts=300;
  for(let i=0;i<=Npts;i++){ const x=i/Npts; const psi=Math.sin(n*Math.PI*x); const val=prob?2*psi*psi:Math.SQRT2*psi; const y=prob?(pt+ih-6)-val*amp*0.95:mid-val*amp; d+=(i?'L':'M')+X(x).toFixed(1)+' '+y.toFixed(1)+' '; }
  const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('stroke',prob?'var(--teal)':'var(--accent3)'); p.setAttribute('stroke-width','2.5'); svg.appendChild(p);
  if(prob){ const fill=document.createElementNS(NS,'path'); fill.setAttribute('d',d+`L${X(1)} ${pt+ih-6} L${X(0)} ${pt+ih-6} Z`); fill.setAttribute('fill','rgba(45,212,191,0.15)'); svg.insertBefore(fill,p); }
  // nodes
  for(let k=0;k<=n;k++){ const x=k/n; const c=document.createElementNS(NS,'circle');c.setAttribute('cx',X(x));c.setAttribute('cy',prob?pt+ih-6:mid);c.setAttribute('r',3);c.setAttribute('fill','var(--text3)');svg.appendChild(c); }
  const tt=document.createElementNS(NS,'text'); tt.setAttribute('x',pl+iw/2); tt.setAttribute('y',pt-6); tt.setAttribute('text-anchor','middle'); tt.setAttribute('fill','var(--text2)'); tt.textContent=(prob?'|ψ':'ψ')+'₍'+n+'₎'+(prob?'|²':'')+'   ·   '+(n-1)+' node'+(n-1!==1?'s':''); svg.appendChild(tt);

  $('#info').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Energy Eₙ</div><div class="stat-value" style="color:var(--accent3)">${EeV<0.01?E.toExponential(3)+' J':EeV.toFixed(3)+' eV'}</div></div>
      <div class="stat-card"><div class="stat-label">in Joules</div><div class="stat-value" style="font-size:14px">${E.toExponential(3)} J</div></div>
      <div class="stat-card"><div class="stat-label">Nodes (interior)</div><div class="stat-value">${n-1}</div></div>
      <div class="stat-card"><div class="stat-label">ΔE (n→n+1)</div><div class="stat-value" style="font-size:14px">${((2*n+1)*h*h/(8*m*L*L)/eV).toExponential(2)} eV</div></div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">Eₙ ∝ n²/L² — energies rise steeply with n and shrink as the box widens. Ground-state energy is never zero (zero-point energy). Levels get further apart as n increases.</div>`;
}
['n','L','mass','prob'].forEach(id=>$('#'+id).addEventListener('input',run));
run();
</script>

</body>
</html>
