<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bohr Atom Model - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/chem-data.js"></script>
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-atom"></i></div><div>Bohr Atom Model</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-atom"></i></div>
      <div>
        <div class="tool-title">Bohr Atom Model</div>
        <div class="tool-desc">Pick an element to see its nucleus and animated electron shells, with the shell-by-shell occupancy.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row">
      <label class="fld" style="flex:1">Element
        <select id="el"></select>
      </label>
      <label class="fld" style="flex-direction:row;align-items:center;gap:7px;margin-top:18px"><input type="checkbox" id="anim" checked style="width:16px;height:16px"> Animate</label>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center">
      <svg id="svg" viewBox="0 0 420 420" style="width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:12px"></svg>
    </div>
    <div id="info"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .shell-tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:12px;margin:3px;font-variant-numeric:tabular-nums}</style>

<script>
const $ = s => document.querySelector(s);
const ORDER=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6]];
function shells(Z){ let left=Z; const sh={}; for(const [orb,cap] of ORDER){ if(left<=0)break; const n=+orb[0]; const e=Math.min(cap,left); sh[n]=(sh[n]||0)+e; left-=e; } return Object.keys(sh).sort((a,b)=>a-b).map(n=>sh[n]); }

const els = (window.CHEM&&CHEM.ELEMENTS)||[];
$('#el').innerHTML = els.map(e=>`<option value="${e.number}">${e.number} - ${e.symbol} · ${e.name}</option>`).join('');
$('#el').value = 11; // sodium

const NS='http://www.w3.org/2000/svg';
let raf=null, t0=0;

function draw(){
  const Z=+$('#el').value; const el=els.find(e=>e.number===Z);
  const sh=shells(Z);
  const neutrons=Math.round((el?el.weight:Z*2)-Z);
  const svg=$('#svg'); svg.innerHTML='';
  const cx=210, cy=210;
  // shell circles + electrons
  const maxR=185; const baseR=46; const step=sh.length>1?(maxR-baseR)/(sh.length):24;
  const dots=[];
  sh.forEach((count,i)=>{
    const r=baseR+step*(i+1);
    const circle=document.createElementNS(NS,'circle');
    circle.setAttribute('cx',cx); circle.setAttribute('cy',cy); circle.setAttribute('r',r);
    circle.setAttribute('fill','none'); circle.setAttribute('stroke','var(--border2)'); circle.setAttribute('stroke-width','1');
    svg.appendChild(circle);
    for(let k=0;k<count;k++){
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('r','5'); c.setAttribute('fill','var(--accent3)');
      c._r=r; c._a=(k/count)*Math.PI*2; c._speed=0.6/(i+1);
      svg.appendChild(c); dots.push(c);
    }
  });
  // nucleus
  const nuc=document.createElementNS(NS,'circle');
  nuc.setAttribute('cx',cx); nuc.setAttribute('cy',cy); nuc.setAttribute('r',Math.min(40,22+Z*0.08));
  nuc.setAttribute('fill','rgba(248,113,113,0.18)'); nuc.setAttribute('stroke','var(--red)'); nuc.setAttribute('stroke-width','1.5');
  svg.appendChild(nuc);
  const lbl=document.createElementNS(NS,'text');
  lbl.setAttribute('x',cx); lbl.setAttribute('y',cy-3); lbl.setAttribute('text-anchor','middle');
  lbl.setAttribute('fill','var(--text)'); lbl.setAttribute('font-size','20'); lbl.setAttribute('font-weight','700');
  lbl.textContent=el?el.symbol:Z; svg.appendChild(lbl);
  const sub=document.createElementNS(NS,'text');
  sub.setAttribute('x',cx); sub.setAttribute('y',cy+15); sub.setAttribute('text-anchor','middle');
  sub.setAttribute('fill','var(--text3)'); sub.setAttribute('font-size','11');
  sub.textContent=`${Z}p · ${neutrons}n`; svg.appendChild(sub);

  function place(time){
    dots.forEach(c=>{ const a=c._a+($('#anim').checked?(time-t0)/1000*c._speed:0); c.setAttribute('cx',cx+c._r*Math.cos(a)); c.setAttribute('cy',cy+c._r*Math.sin(a)); });
  }
  if(raf) cancelAnimationFrame(raf);
  t0=performance.now();
  function loop(time){ place(time); if($('#anim').checked) raf=requestAnimationFrame(loop); }
  if($('#anim').checked) raf=requestAnimationFrame(loop); else place(t0);

  $('#info').innerHTML=`
    <div class="stat-grid" style="margin-bottom:10px">
      <div class="stat-card"><div class="stat-label">Atomic number Z</div><div class="stat-value">${Z}</div></div>
      <div class="stat-card"><div class="stat-label">Electrons</div><div class="stat-value">${Z}</div></div>
      <div class="stat-card"><div class="stat-label">Neutrons (≈)</div><div class="stat-value">${neutrons}</div></div>
      <div class="stat-card"><div class="stat-label">Shells</div><div class="stat-value">${sh.length}</div></div>
    </div>
    <div>Shell occupancy: ${sh.map((c,i)=>`<span class="shell-tag">n=${i+1}: ${c}e⁻</span>`).join('')}</div>
    <div class="muted" style="font-size:12px;margin-top:8px">Shells filled by the aufbau order then grouped by principal quantum number n. Neutron count uses the most-abundant-isotope rounding of the standard atomic weight.</div>`;
}
['el','anim'].forEach(id=>$('#'+id).addEventListener('change',draw));
draw();
</script>

</body>
</html>
