<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Author Name Disambiguator — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-users"></i></div><div>Author Disambiguator</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:880px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(96,165,250,0.12);color:var(--blue)"><i class="ti ti-users"></i></div>
      <div>
        <div class="tool-title">Author Name Disambiguator</div>
        <div class="tool-desc">A common name maps to many researchers. Search OpenAlex to see the distinct author profiles — affiliation, ORCID, output and top topics.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <form id="f" class="row" style="gap:8px">
      <input type="text" id="q" placeholder="e.g. Y. Zhang, J. Smith, Maria Garcia" style="flex:1;min-width:220px">
      <button class="btn btn-primary" type="submit"><i class="ti ti-search"></i> Find profiles</button>
    </form>
    <div id="out"><div class="muted">Enter an author name to see the distinct people behind it.</div></div>
  </div>
</main>

<style>.arow{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);margin-bottom:8px}
  .arow h3{margin:0 0 3px;font-size:15px}
  .pill{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--text2);margin-right:6px;display:inline-block;margin-top:4px}
  .pill.orcid{background:rgba(74,222,128,0.16);color:var(--green)}
  a.lnk{color:var(--accent3);text-decoration:none;font-size:12px}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAIL='mailto=academy-tools@users.noreply.github.com';

$('#f').addEventListener('submit',async e=>{
  e.preventDefault(); const q=$('#q').value.trim(); if(!q) return;
  const out=$('#out'); out.innerHTML='<div class="muted"><i class="ti ti-loader"></i> Searching OpenAlex authors…</div>';
  try{
    const r=await fetch(`https://api.openalex.org/authors?search=${encodeURIComponent(q)}&per_page=25&${MAIL}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.results||!d.results.length){ out.innerHTML='<div class="muted">No author profiles found.</div>'; return; }
    out.innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:8px">${d.meta.count.toLocaleString()} candidate profiles — these are <b>distinct people</b> sharing this name. Match on affiliation, ORCID and topics.</div>`+
      d.results.map(a=>{
        const aff=a.last_known_institutions&&a.last_known_institutions[0]?a.last_known_institutions[0].display_name:(a.last_known_institution&&a.last_known_institution.display_name||'');
        const topics=(a.x_concepts||a.topics||[]).slice(0,4).map(c=>c.display_name);
        return `<div class="arow">
          <h3>${esc(a.display_name)}</h3>
          <div style="font-size:12px;color:var(--text3)">${esc(aff)||'affiliation unknown'}</div>
          <div>
            <span class="pill">${(a.works_count||0).toLocaleString()} works</span>
            <span class="pill">${(a.cited_by_count||0).toLocaleString()} cites</span>
            <span class="pill">h-index ${a.summary_stats&&a.summary_stats.h_index||'—'}</span>
            ${a.orcid?`<span class="pill orcid">ORCID</span>`:''}
          </div>
          ${topics.length?`<div style="font-size:12px;color:var(--text2);margin-top:5px">${topics.map(esc).join(' · ')}</div>`:''}
          <div style="margin-top:5px">${a.orcid?`<a class="lnk" href="${esc(a.orcid)}" target="_blank" rel="noopener">ORCID ↗</a> · `:''}<a class="lnk" href="${esc(a.id)}" target="_blank" rel="noopener">OpenAlex ↗</a></div>
        </div>`;
      }).join('');
  }catch(err){ out.innerHTML=`<div class="muted">Couldn't reach OpenAlex (${esc(err.message)}).</div>`; }
});
</script>

</body>
</html>
