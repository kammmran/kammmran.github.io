<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pH Scale & Indicators - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-test-pipe"></i></div><div>pH Scale &amp; Indicators</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(244,114,182,0.12);color:var(--pink)"><i class="ti ti-test-pipe"></i></div>
      <div>
        <div class="tool-title">pH Scale &amp; Indicators</div>
        <div class="tool-desc">Slide along the 0–14 scale to see acidity, the colour of common indicators, and the H⁺/OH⁻ concentrations.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row">
      <label class="fld" style="flex:1">pH = <b id="phval">7.0</b>
        <input type="range" id="ph" min="0" max="14" step="0.1" value="7" style="width:100%">
      </label>
      <label class="fld">Common solution<select id="preset"></select></label>
    </div>
    <svg id="scale" viewBox="0 0 760 90" style="width:100%;height:auto;border-radius:10px"></svg>
    <div id="info"></div>
    <div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px">Indicator colours at this pH</div>
      <div id="indics" class="ind-grid"></div>
    </div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .ind{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2)}
  .ind .nm{font-size:12px;color:var(--text2);margin-bottom:6px}
  .ind .sw{height:26px;border-radius:6px;border:1px solid var(--border)}
  .ind .cl{font-size:11px;color:var(--text3);margin-top:4px}</style>

<script>
const $ = s => document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function phColor(ph){ // red(0) -> orange -> yellow -> green(7) -> blue -> indigo/violet(14)
  const stops=[[0,'#e23b3b'],[2,'#ef6b2b'],[4,'#f2b134'],[6,'#cdd33a'],[7,'#56c057'],[8,'#37b6a6'],[10,'#3a8fd6'],[12,'#3a55c9'],[14,'#5a36b0']];
  for(let i=0;i<stops.length-1;i++){ if(ph<=stops[i+1][0]){ const [a,ca]=stops[i],[b,cb]=stops[i+1]; const t=(ph-a)/(b-a); return lerp(ca,cb,t);} } return stops[stops.length-1][1];
}
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function lerp(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }

const indicators=[
  {name:'Litmus', ranges:[[0,5,'#e23b3b','red'],[5,8,'#9b59b6','purple'],[8,14,'#3a55c9','blue']]},
  {name:'Phenolphthalein', ranges:[[0,8.2,'#f4f4f5','colourless'],[8.2,10,'#f6a8d8','pale pink'],[10,14,'#e84fa8','magenta']]},
  {name:'Methyl orange', ranges:[[0,3.1,'#e23b3b','red'],[3.1,4.4,'#ef8b2b','orange'],[4.4,14,'#f2c734','yellow']]},
  {name:'Bromothymol blue', ranges:[[0,6,'#f2c734','yellow'],[6,7.6,'#6fae4f','green'],[7.6,14,'#3a8fd6','blue']]},
  {name:'Universal', ranges:[[0,14,null,'gradient']]},
];
const presets=[['Custom…',null],['Battery acid',0.5],['Lemon juice',2.2],['Vinegar',2.9],['Orange juice',3.5],['Coffee',5.0],['Milk',6.6],['Pure water',7.0],['Blood',7.4],['Sea water',8.1],['Baking soda',8.4],['Soap',10],['Ammonia',11.5],['Bleach',12.5],['Drain cleaner',14]];
$('#preset').innerHTML=presets.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('');
$('#preset').addEventListener('change',()=>{ const p=presets[+$('#preset').value]; if(p[1]!=null){ $('#ph').value=p[1]; } run(true); });

function indColor(ind,ph){ if(ind.ranges[0][3]==='gradient') return phColor(ph); for(const [a,b,c,l] of ind.ranges){ if(ph>=a&&ph<b) return {c,l}; } const last=ind.ranges[ind.ranges.length-1]; return {c:last[2],l:last[3]}; }

function run(fromPreset){
  const ph=+$('#ph').value; $('#phval').textContent=ph.toFixed(1);
  if(!fromPreset) $('#preset').value='0';
  // scale bar
  const svg=$('#scale'); svg.innerHTML=''; const W=760,H=90,pad=10,bw=W-pad*2,bh=44;
  for(let i=0;i<=140;i++){ const p=i/10; const r=document.createElementNS(NS,'rect'); r.setAttribute('x',pad+bw*p/14);r.setAttribute('y',pad);r.setAttribute('width',bw/140+0.6);r.setAttribute('height',bh);r.setAttribute('fill',phColor(p));svg.appendChild(r); }
  for(let n=0;n<=14;n++){ const x=pad+bw*n/14; const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',pad+bh+18);t.setAttribute('text-anchor','middle');t.setAttribute('fill','var(--text3)');t.setAttribute('font-size','11');t.textContent=n;svg.appendChild(t); }
  // labels
  ['ACIDIC','NEUTRAL','BASIC'].forEach((l,i)=>{ const x=pad+bw*[0.16,0.5,0.84][i]; const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',pad-0);t.setAttribute('text-anchor','middle');t.setAttribute('fill','var(--text3)');t.setAttribute('font-size','9');t.textContent=l;svg.appendChild(t); });
  // marker
  const mx=pad+bw*ph/14; const m=document.createElementNS(NS,'path'); m.setAttribute('d',`M${mx} ${pad-4} l-7 -9 h14 z`); m.setAttribute('fill','var(--text)'); svg.appendChild(m);
  const ml=document.createElementNS(NS,'line');ml.setAttribute('x1',mx);ml.setAttribute('y1',pad);ml.setAttribute('x2',mx);ml.setAttribute('y2',pad+bh);ml.setAttribute('stroke','#000');ml.setAttribute('stroke-width','2');svg.appendChild(ml);

  const H_=Math.pow(10,-ph), OH=Math.pow(10,-(14-ph));
  const cls=ph<6.5?'Acidic':ph>7.5?'Basic':'≈ Neutral';
  const clr=ph<6.5?'var(--red)':ph>7.5?'var(--blue)':'var(--green)';
  $('#info').innerHTML=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Classification</div><div class="stat-value" style="color:${clr}">${cls}</div></div>
    <div class="stat-card"><div class="stat-label">[H⁺]</div><div class="stat-value" style="font-size:15px">${H_.toExponential(2)} M</div></div>
    <div class="stat-card"><div class="stat-label">[OH⁻]</div><div class="stat-value" style="font-size:15px">${OH.toExponential(2)} M</div></div>
    <div class="stat-card"><div class="stat-label">pOH</div><div class="stat-value">${(14-ph).toFixed(1)}</div></div>
  </div>`;
  // indicators
  $('#indics').innerHTML=indicators.map(ind=>{ const r=indColor(ind,ph); const c=typeof r==='string'?r:r.c; const l=typeof r==='string'?'spectrum':r.l; return `<div class="ind"><div class="nm">${ind.name}</div><div class="sw" style="background:${c}"></div><div class="cl">${l}</div></div>`; }).join('');
}
$('#ph').addEventListener('input',()=>run(false));
run(false);
</script>

</body>
</html>
