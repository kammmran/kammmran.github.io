<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structure Gallery — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-layout-grid"></i></div><div>Structure Gallery</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1240px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(244,114,182,0.12);color:var(--pink)"><i class="ti ti-layout-grid"></i></div>
      <div>
        <div class="tool-title">Structure Depiction Gallery</div>
        <div class="tool-desc">Paste a list of SMILES and get a grid of clean 2D structures. Click any card to download its SVG.</div>
      </div>
    </div>
    <button class="btn btn-sm btn-ghost" id="sample">Sample</button>
  </div>

  <div class="panel" style="min-height:auto">
    <textarea id="input" placeholder="One SMILES per line. Optionally add a label after a space:  CCO  ethanol" style="min-height:110px"></textarea>
  </div>

  <div id="gallery" class="gallery"></div>
</main>

<div class="toast" id="toast"><i class="ti ti-check"></i><span></span></div>

<style>
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
  .card{background:#fff;border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .12s}
  .card:hover{transform:translateY(-3px)}
  .card .pic{height:170px;display:flex;align-items:center;justify-content:center;padding:6px}
  .card .lbl{background:var(--bg2);color:var(--text2);font-size:11px;padding:7px 9px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border)}
  .card.bad{background:var(--surface);border-color:rgba(248,113,113,0.4)}
  .card.bad .pic{color:var(--red);font-size:12px;height:auto;padding:24px 10px}
</style>

<script src="https://cdn.jsdelivr.net/npm/openchemlib@8/dist/openchemlib-full.js"></script>
<script>
const $ = s => document.querySelector(s);
function toast(m){ const t=$('#toast'); t.querySelector('span').textContent=m; t.classList.add('show'); clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ready(cb){ if(window.OCL&&OCL.Molecule)return cb(); let n=0;const iv=setInterval(()=>{if(window.OCL&&OCL.Molecule){clearInterval(iv);cb();}else if(++n>60){clearInterval(iv);$('#gallery').innerHTML='<div class="muted">Could not load chemistry engine.</div>';}},100); }

function run(){
  ready(()=>{
    const lines=$('#input').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const g=$('#gallery'); g.innerHTML='';
    if(!lines.length){ g.innerHTML='<div class="muted" style="grid-column:1/-1">Paste SMILES to render structures.</div>'; return; }
    lines.forEach(line=>{
      const parts=line.split(/\s+/); const smi=parts[0]; const label=parts.slice(1).join(' ')||smi;
      const card=document.createElement('div'); card.className='card';
      try{
        const mol=OCL.Molecule.fromSmiles(smi); if(mol.getAllAtoms()===0) throw 0;
        const svg=mol.toSVG(200,170,'m',{autoCrop:true,autoCropMargin:8,suppressChiralText:false});
        card.innerHTML=`<div class="pic">${svg}</div><div class="lbl" title="${esc(smi)}">${esc(label)}</div>`;
        card.addEventListener('click',()=>{ const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=(label.replace(/[^a-z0-9]/gi,'_')||'structure')+'.svg';a.click();toast('SVG downloaded'); });
      }catch(e){ card.className='card bad'; card.innerHTML=`<div class="pic">Invalid SMILES</div><div class="lbl">${esc(smi)}</div>`; }
      g.appendChild(card);
    });
  });
}
$('#input').addEventListener('input',()=>{clearTimeout(window._r);window._r=setTimeout(run,250);});
$('#sample').addEventListener('click',()=>{ $('#input').value='CC(=O)Oc1ccccc1C(=O)O aspirin\nCN1C=NC2=C1C(=O)N(C(=O)N2C)C caffeine\nCC(C)Cc1ccc(cc1)C(C)C(=O)O ibuprofen\nc1ccc2c(c1)cccc2 naphthalene\nC1CCCCC1 cyclohexane\nOCC1OC(O)C(O)C(O)C1O glucose'; run(); });
run();
</script>

</body>
</html>
