<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Symbol Generator - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-superscript"></i></div><div>Term Symbol</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(74,222,128,0.12);color:var(--green)"><i class="ti ti-superscript"></i></div>
      <div>
        <div class="tool-title">Ground-State Term Symbol</div>
        <div class="tool-desc">Hund's rules → the ground-state term symbol <sup>2S+1</sup>L_J for any open subshell, with the orbital occupancy.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row">
      <label class="fld">Subshell<select id="l"><option value="0">s (ℓ=0)</option><option value="1" selected>p (ℓ=1)</option><option value="2">d (ℓ=2)</option><option value="3">f (ℓ=3)</option></select></label>
      <label class="fld">Electrons<input type="number" id="e" value="2" min="0" step="1"></label>
      <span class="muted" id="cap" style="margin-top:18px;font-size:12px"></span>
    </div>
    <div id="boxes" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"></div>
    <div id="result"></div>
    <div id="info"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .obox{display:flex;flex-direction:column;align-items:center;gap:4px}
  .obox .b{width:42px;height:34px;border:1.5px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);letter-spacing:-2px}
  .obox .ml{font-size:11px;color:var(--text3)}
  .term{font-size:40px;font-weight:700;text-align:center;color:var(--green);font-family:Georgia,serif}
  .term sup,.term sub{font-size:20px}</style>

<script>
const $ = s => document.querySelector(s);
const Lletter=['S','P','D','F','G','H','I','K'];
function frac(x){ if(Number.isInteger(x)) return ''+x; return (x*2)+'/2'; }

function compute(l,e){
  const nOrb=2*l+1, full=2*nOrb;
  if(e<=0||e>=full) return {L:0,S:0,J:0,mult:1,occ:Array(nOrb).fill(0),special:e<=0?'empty':'full'};
  const firstUp=Math.min(e,nOrb); const rem=e-firstUp;
  // occupancy per orbital (index 0 → ml=l): 1 (up) for first firstUp, +1 (down) for first rem
  const occ=Array(nOrb).fill(0);
  for(let i=0;i<firstUp;i++) occ[i]+=1;
  for(let i=0;i<rem;i++) occ[i]+=2; // mark paired (value 2 = up+down)
  let ML=0; for(let i=0;i<nOrb;i++){ const ml=l-i; if(occ[i]===1)ML+=ml; else if(occ[i]===2)ML+=2*ml*0+ml*2; }
  // recompute ML cleanly: up electrons occupy 0..firstUp-1, down occupy 0..rem-1
  ML=0; for(let i=0;i<firstUp;i++)ML+=(l-i); for(let i=0;i<rem;i++)ML+=(l-i);
  const unpaired=firstUp-rem; const S=unpaired/2; const L=Math.abs(ML);
  const J = (e<=nOrb) ? Math.abs(L-S) : (L+S);
  return {L,S,J,mult:2*S+1,occ,unpaired,nOrb};
}

function run(){
  const l=+$('#l').value; const nOrb=2*l+1, full=2*nOrb;
  let e=Math.max(0,Math.min(full,Math.round(+$('#e').value))); $('#e').value=e; $('#e').max=full;
  $('#cap').textContent=`subshell holds up to ${full} electrons`;
  const r=compute(l,e);
  // boxes
  const occ=r.occ||Array(nOrb).fill(0);
  $('#boxes').innerHTML=Array.from({length:nOrb},(_,i)=>{ const ml=l-i; const v=occ[i]; const arrows=v===2?'↑↓':v===1?'↑':''; return `<div class="obox"><div class="b">${arrows}</div><div class="ml">mℓ=${ml>0?'+':''}${ml}</div></div>`; }).join('');
  // term
  const Lc=Lletter[r.L]||'?';
  $('#result').innerHTML=`<div class="term"><sup>${r.mult}</sup>${Lc}<sub>${frac(r.J)}</sub></div>`;
  if(r.special){ $('#info').innerHTML=`<div class="muted" style="font-size:13px;text-align:center">A ${r.special} subshell is a closed shell → <b>¹S₀</b> (L=0, S=0, J=0).</div>`; return; }
  $('#info').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total spin S</div><div class="stat-value">${frac(r.S)}</div></div>
      <div class="stat-card"><div class="stat-label">Multiplicity 2S+1</div><div class="stat-value">${r.mult}</div></div>
      <div class="stat-card"><div class="stat-label">Total orbital L</div><div class="stat-value">${r.L} (${Lc})</div></div>
      <div class="stat-card"><div class="stat-label">Total J</div><div class="stat-value">${frac(r.J)}</div></div>
      <div class="stat-card"><div class="stat-label">Unpaired e⁻</div><div class="stat-value">${r.unpaired}</div></div>
      <div class="stat-card"><div class="stat-label">Shell filling</div><div class="stat-value" style="font-size:13px">${e<nOrb?'< half':e===nOrb?'half':'> half'}</div></div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">Hund's rules: (1) maximise S → spread electrons with parallel spins; (2) maximise L for that S; (3) J = |L−S| if the subshell is ≤ half full, else L+S. Example: 2p² → ³P₀ (carbon), 3d⁵ → ⁶S₅⁄₂ (Mn²⁺).</div>`;
}
['l','e'].forEach(id=>$('#'+id).addEventListener('input',run));
run();
</script>

</body>
</html>
