<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Methodology Extractor — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-microscope"></i></div><div>Methodology Extractor</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:880px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(96,165,250,0.12);color:var(--blue)"><i class="ti ti-microscope"></i></div>
      <div>
        <div class="tool-title">Methodology Extractor</div>
        <div class="tool-desc">Surfaces the methods sentences — design, sample, instruments, analysis — so you can compare how different papers did the work.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Paste the paper text
      <textarea id="txt" style="min-height:200px" placeholder="Paste text here…"></textarea>
    </label>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .m{padding:8px 12px;border-left:3px solid var(--blue);background:rgba(96,165,250,0.07);border-radius:4px;margin-bottom:6px;font-size:13.5px;line-height:1.5}
  .cat{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);font-weight:600;margin-bottom:2px}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CATS=[
  ['Design',/\b(randomi[sz]ed|controlled trial|cohort|cross-sectional|longitudinal|case[- ]control|retrospective|prospective|qualitative|quantitative|mixed[- ]method|experiment\w*|survey|observational|in vitro|in vivo|simulation)\b/i],
  ['Sample',/\b(\d+\s+(participants|subjects|patients|samples|respondents|images|compounds|observations|cells)|sample size|recruited|enrolled|n\s*=\s*\d|inclusion criteria|exclusion criteria)\b/i],
  ['Procedure',/\b(we (used|performed|conducted|measured|collected|prepared|synthesized|administered|applied|implemented)|data (were|was) collected|protocol|procedure|incubated|assay|questionnaire|interview)\b/i],
  ['Instruments/Materials',/\b(using (a|an|the)|software|spectrometer|microscope|kit|reagent|GPU|model was trained|library|toolkit|apparatus|instrument|µg|mg\/ml|°C|nm|wavelength)\b/i],
  ['Analysis',/\b(statistical analysis|regression|ANOVA|t-test|chi[- ]square|p\s*[<>=]|confidence interval|SPSS|R version|Python|machine learning|cross-validation|normali[sz]ation|fitted|estimated)\b/i],
];
function sentences(t){ return (t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(s=>s.split(' ').length>=4); }

function run(){
  const t=$('#txt').value.trim(); const out=$('#out');
  if(!t){ out.innerHTML=''; return; }
  const sents=sentences(t); const tally={}; CATS.forEach(([c])=>tally[c]=0);
  const rows=[];
  sents.forEach(s=>{ const cat=CATS.find(([c,re])=>re.test(s)); if(cat){ tally[cat[0]]++; rows.push([cat[0],s]); } });
  if(!rows.length){ out.innerHTML='<div class="muted" style="margin-top:6px">No methods sentences detected — paste the Methods/Materials section.</div>'; return; }
  out.innerHTML=`<div class="stat-grid" style="margin-bottom:12px">${CATS.map(([c])=>`<div class="stat-card"><div class="stat-label">${c}</div><div class="stat-value" style="font-size:18px">${tally[c]}</div></div>`).join('')}</div>`+
    rows.map(([c,s])=>`<div class="m"><div class="cat">${c}</div>${esc(s)}</div>`).join('')+
    `<div class="muted" style="font-size:12px;margin-top:8px">Heuristic tagging by methodological cue words. Useful for building a methods-comparison matrix across papers.</div>`;
}
$('#txt').addEventListener('input',run);
</script>

</body>
</html>
