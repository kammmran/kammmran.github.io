<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Paper Question Answering - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-messages"></i></div><div>Multi-Paper Q&A</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:900px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(96,165,250,0.12);color:var(--blue)"><i class="ti ti-messages"></i></div>
      <div>
        <div class="tool-title">Multi-Paper Question Answering</div>
        <div class="tool-desc">Paste several papers and ask a question → it retrieves and ranks the most relevant passages across all of them (extractive, with sources). Offline TF-IDF retrieval.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Papers - separate each with a blank line or <code>---</code> (start with "Title:" to label)
      <textarea id="txt" style="min-height:160px" placeholder="Paper A: full text…&#10;---&#10;Paper B: full text…"></textarea>
    </label>
    <label class="fld">Your question
      <div class="row" style="gap:8px"><input id="q" placeholder="e.g. what sample sizes were used?" style="flex:1"><button class="btn btn-primary" id="run"><i class="ti ti-search"></i> Answer</button></div>
    </label>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .ans{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);margin-bottom:7px;font-size:13.5px;line-height:1.5}
  .ans .src{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:3px}
  .hl{background:rgba(96,165,250,0.25);border-radius:3px;padding:0 2px}
  .score{float:right;font-size:11px;color:var(--text3)}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STOP=new Set('the a an and or but of to in on for with as by at from is are was were be been this that these those it its their our we they not no what which how many much does did do done using used based study'.split(' '));
function terms(t){ return (t.toLowerCase().match(/[a-z0-9][a-z0-9'-]{2,}/g)||[]).filter(w=>!STOP.has(w)); }
function sentences(t){ return (t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(s=>s.split(' ').length>=4); }

$('#run').addEventListener('click',()=>{
  const raw=$('#txt').value.trim(); const q=$('#q').value.trim(); const out=$('#out');
  if(!raw||!q){ out.innerHTML='<div class="muted" style="margin-top:6px">Paste papers and ask a question.</div>'; return; }
  const papers=raw.split(/\n\s*---+\s*\n|\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>20);
  // collect sentences with source
  const docs=[]; papers.forEach((p,i)=>{ const m=p.match(/^([^:\n]{1,50}):\s/); const label=m?m[1]:`Paper ${i+1}`; const body=m?p.slice(m[0].length):p; sentences(body).forEach(s=>docs.push({s,src:label})); });
  if(!docs.length){ out.innerHTML='<div class="muted">No usable sentences found.</div>'; return; }
  // idf
  const df={}; docs.forEach(d=>{ new Set(terms(d.s)).forEach(w=>df[w]=(df[w]||0)+1); });
  const N=docs.length; const idf=w=>Math.log(1+N/((df[w]||0)+1));
  const qTerms=[...new Set(terms(q))];
  const scored=docs.map(d=>{ const ts=terms(d.s); const set=new Set(ts); let sc=0; qTerms.forEach(w=>{ if(set.has(w)) sc+=idf(w); }); // boost for numbers if question seems quantitative
    if(/\b(how many|how much|number|size|rate|percent|n=)\b/i.test(q)&&/\d/.test(d.s)) sc*=1.4; return {...d,sc}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,8);
  if(!scored.length){ out.innerHTML='<div class="muted" style="margin-top:6px">No passage matched your question - try different keywords.</div>'; return; }
  const qset=new Set(qTerms);
  out.innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:8px">Top passages across ${papers.length} paper(s) relevant to: <b>${esc(q)}</b></div>`+
    scored.map(d=>{ const hl=esc(d.s).replace(/\b[a-z0-9'-]+\b/gi,w=>qset.has(w.toLowerCase())?`<span class="hl">${w}</span>`:w); return `<div class="ans"><div class="src">${esc(d.src)} <span class="score">relevance ${d.sc.toFixed(1)}</span></div>${hl}</div>`; }).join('')+
    `<div class="muted" style="font-size:12px;margin-top:8px">Extractive retrieval - returns real sentences from your papers ranked by keyword relevance (TF-IDF), so it never invents answers. Read the passages to form the answer.</div>`;
});
</script>

</body>
</html>
