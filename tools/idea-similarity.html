<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Idea Similarity Detector — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-affiliate"></i></div><div>Idea Similarity Detector</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:860px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(96,165,250,0.12);color:var(--blue)"><i class="ti ti-affiliate"></i></div>
      <div>
        <div class="tool-title">Research Idea Similarity Detector</div>
        <div class="tool-desc">Check a new idea against a list of existing ideas/projects to catch near-duplicates and overlaps before you commit. Offline cosine similarity.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Your new idea
      <textarea id="query" style="min-height:70px" placeholder="Describe the idea you want to check…"></textarea>
    </label>
    <label class="fld">Existing ideas / projects — one per line
      <textarea id="list" style="min-height:130px" placeholder="Idea A description…&#10;Idea B description…&#10;Idea C description…"></textarea>
    </label>
    <div class="row"><button class="btn btn-primary" id="run"><i class="ti ti-search"></i> Check overlap</button></div>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .prow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);margin-bottom:6px;font-size:13px}
  .prow.dup{border-color:rgba(248,113,113,0.45)}
  .bar{flex:none;width:120px;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
  .bar>div{height:100%}
  .tag{flex:none;font-size:10px;padding:1px 8px;border-radius:999px}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STOP=new Set('the a an and or but of to in on for with as by at from is are was were be this that these those it its their our we they not no using used based study research method models data approach new novel'.split(' '));
function tf(t){ const m={}; (t.toLowerCase().match(/[a-z][a-z'-]{2,}/g)||[]).forEach(w=>{ if(!STOP.has(w))m[w]=(m[w]||0)+1; }); return m; }
function cosine(a,b){ let dot=0,na=0,nb=0; for(const k in a){ na+=a[k]*a[k]; if(b[k])dot+=a[k]*b[k]; } for(const k in b)nb+=b[k]*b[k]; return (na&&nb)?dot/Math.sqrt(na*nb):0; }
function shared(a,b){ return Object.keys(a).filter(k=>b[k]).sort((x,y)=>(b[y])-(b[x])); }

$('#run').addEventListener('click',()=>{
  const q=$('#query').value.trim(); const list=$('#list').value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const out=$('#out');
  if(!q){ out.innerHTML='<div class="muted" style="margin-top:6px">Describe your idea.</div>'; return; }
  if(!list.length){ out.innerHTML='<div class="muted" style="margin-top:6px">Add existing ideas to compare.</div>'; return; }
  const qv=tf(q);
  const res=list.map(p=>{ const pv=tf(p); return {p,sim:cosine(qv,pv),sh:shared(qv,pv)}; }).sort((a,b)=>b.sim-a.sim);
  const maxSim=Math.round(res[0].sim*100);
  const verdict=maxSim>=60?{t:'Likely duplicate / strong overlap',c:'--red'}:maxSim>=35?{t:'Notable overlap — differentiate clearly',c:'--amber'}:{t:'Distinct from the list',c:'--green'};
  out.innerHTML=`<div style="margin-bottom:10px">Highest overlap: <b style="color:var(${verdict.c})">${maxSim}%</b> — ${verdict.t}</div>`+
    res.map(x=>{ const pc=Math.round(x.sim*100); const c=pc>=60?'--red':pc>=35?'--amber':'--green'; const dup=pc>=60; return `<div class="prow ${dup?'dup':''}"><div class="bar"><div style="width:${pc}%;background:var(${c})"></div></div><span style="width:42px;color:var(${c})">${pc}%</span><span style="flex:1">${esc(x.p.slice(0,80))}${x.p.length>80?'…':''}</span>${x.sh.length?`<span class="tag" style="background:var(--surface2);color:var(--text3)">${x.sh.slice(0,3).map(esc).join(', ')}</span>`:''}</div>`; }).join('')+
    `<div class="muted" style="font-size:12px;margin-top:8px">Word-overlap similarity (cosine). The tags show the shared terms driving each match. Verify high scores manually.</div>`;
});
</script>

</body>
</html>
