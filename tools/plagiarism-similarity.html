<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plagiarism Similarity Checker — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-copy-check"></i></div><div>Plagiarism Similarity</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:920px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(251,191,36,0.12);color:var(--amber)"><i class="ti ti-copy-check"></i></div>
      <div>
        <div class="tool-title">Plagiarism Similarity Checker</div>
        <div class="tool-desc">Compare two documents — overlap score and the exact phrases they share, highlighted. (Text-vs-text; not a web/database scan.)</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="grid2">
      <label class="fld">Document A (source / reference)<textarea id="a" style="min-height:150px" placeholder="Paste the first text…"></textarea></label>
      <label class="fld">Document B (your text — checked against A)<textarea id="b" style="min-height:150px" placeholder="Paste the second text…"></textarea></label>
    </div>
    <div class="row"><label class="fld" style="flex-direction:row;align-items:center;gap:8px">Match length<select id="n"><option value="4">4 words</option><option value="5" selected>5 words</option><option value="7">7 words</option></select></label>
      <button class="btn btn-primary" id="run"><i class="ti ti-search"></i> Compare</button></div>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #render{line-height:1.8;font-size:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
  .m{background:rgba(251,191,36,0.28);border-radius:3px;padding:0 1px}
  .big{font-size:40px;font-weight:800;font-family:Georgia,serif;text-align:center}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const toks = t => (t.toLowerCase().match(/[a-z0-9']+/g)||[]);

$('#run').addEventListener('click',()=>{
  const aRaw=$('#a').value, bRaw=$('#b').value; const N=+$('#n').value; const out=$('#out');
  if(!aRaw.trim()||!bRaw.trim()){ out.innerHTML='<div class="muted" style="margin-top:6px">Paste text into both boxes.</div>'; return; }
  const A=toks(aRaw), B=toks(bRaw);
  if(A.length<N||B.length<N){ out.innerHTML='<div class="muted" style="margin-top:6px">Texts too short for this match length.</div>'; return; }
  // build set of A n-grams
  const aGrams=new Set(); for(let i=0;i+N<=A.length;i++) aGrams.add(A.slice(i,i+N).join(' '));
  // mark which token positions in B are part of a matched n-gram
  const matched=new Array(B.length).fill(false); let matchGrams=0; let totalGrams=0;
  for(let i=0;i+N<=B.length;i++){ totalGrams++; const g=B.slice(i,i+N).join(' '); if(aGrams.has(g)){ matchGrams++; for(let k=i;k<i+N;k++) matched[k]=true; } }
  const containment=totalGrams?matchGrams/totalGrams:0;
  const matchedTokens=matched.filter(Boolean).length;
  const pct=Math.round(matchedTokens/B.length*100);
  // highlight in B preserving original text: re-walk bRaw word by word
  let bi=0; const html=esc(bRaw).replace(/[A-Za-z0-9']+/g,(w)=>{ const m=matched[bi]; bi++; return m?`<span class="m">${w}</span>`:w; });
  const band=pct>=25?'--red':pct>=10?'--amber':'--green';
  const verdict=pct>=25?'High overlap — substantial shared phrasing':pct>=10?'Moderate overlap — paraphrase or quote & cite':'Low overlap';
  out.innerHTML=`<div class="big" style="color:var(${band})">${pct}<span style="font-size:18px">%</span></div>
    <div style="text-align:center;color:var(${band});font-weight:600;margin-bottom:6px">${verdict}</div>
    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat-card"><div class="stat-label">Matched ${N}-grams</div><div class="stat-value">${matchGrams}/${totalGrams}</div></div>
      <div class="stat-card"><div class="stat-label">Containment</div><div class="stat-value">${Math.round(containment*100)}%</div></div>
      <div class="stat-card"><div class="stat-label">Words highlighted</div><div class="stat-value">${matchedTokens}/${B.length}</div></div>
    </div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px">Document B with shared phrases highlighted</div>
    <div id="render">${html}</div>
    <div class="muted" style="font-size:12px;margin-top:8px">Compares only the two pasted texts (e.g. your draft vs a source, or two of your own papers for self-plagiarism). It does <b>not</b> search the web or any database — use Turnitin/iThenticate for that.</div>`;
});
</script>

</body>
</html>
