<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-clock-play"></i></div><div>Pomodoro Timer</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:900px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(248,113,113,0.12);color:var(--red)"><i class="ti ti-clock-play"></i></div>
      <div>
        <div class="tool-title">Pomodoro Timer</div>
        <div class="tool-desc">Focus → short break → focus → long break. Tracks daily sessions & streak locally.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="text-align:center; min-height:auto">
    <div id="phase-label" class="panel-label" style="justify-content:center; font-size:13px"><span id="phase-text">Focus</span></div>
    <div id="timer-display" style="font-size:88px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-2px; color:var(--text); margin:14px 0">25:00</div>
    <div id="task-input-wrap" style="margin-bottom:18px">
      <input type="text" id="task" placeholder="What are you working on?" style="max-width:380px; margin:0 auto; text-align:center">
    </div>
    <div class="row" style="justify-content:center; gap:10px">
      <button class="btn btn-primary" id="start-btn"><i class="ti ti-player-play"></i> Start</button>
      <button class="btn" id="pause-btn" disabled><i class="ti ti-player-pause"></i> Pause</button>
      <button class="btn" id="skip-btn"><i class="ti ti-player-skip-forward"></i> Skip</button>
      <button class="btn" id="reset-btn"><i class="ti ti-refresh"></i> Reset</button>
    </div>
    <div class="row" style="justify-content:center; margin-top:14px; gap:6px">
      <span id="dot-1" class="cycle-dot"></span>
      <span id="dot-2" class="cycle-dot"></span>
      <span id="dot-3" class="cycle-dot"></span>
      <span id="dot-4" class="cycle-dot"></span>
    </div>
  </div>

  <div class="workspace" style="margin-top:16px">
    <div class="panel">
      <div class="panel-label"><span>Today</span></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Focus sessions</div><div class="stat-value" id="today-sessions">0</div></div>
        <div class="stat-card"><div class="stat-label">Focused time</div><div class="stat-value" id="today-time">0m</div></div>
        <div class="stat-card"><div class="stat-label">Streak</div><div class="stat-value" id="streak">0 🔥</div></div>
        <div class="stat-card"><div class="stat-label">All time</div><div class="stat-value" id="total-sessions">0</div></div>
      </div>
      <div class="divider"></div>
      <div class="panel-label"><span>Last 7 days</span></div>
      <div id="week-bars" style="display:flex; gap:6px; align-items:flex-end; height:80px"></div>
      <div id="week-labels" style="display:flex; gap:6px; margin-top:6px; font-size:11px; color:var(--text3)"></div>
    </div>

    <div class="panel">
      <div class="panel-label"><span>Settings</span></div>
      <label class="row" style="margin-bottom:10px; gap:8px; font-size:13px; color:var(--text2)">
        Focus minutes
        <input type="number" id="cfg-focus" min="1" max="120" style="width:90px">
      </label>
      <label class="row" style="margin-bottom:10px; gap:8px; font-size:13px; color:var(--text2)">
        Short break
        <input type="number" id="cfg-short" min="1" max="60" style="width:90px">
      </label>
      <label class="row" style="margin-bottom:10px; gap:8px; font-size:13px; color:var(--text2)">
        Long break
        <input type="number" id="cfg-long" min="1" max="60" style="width:90px">
      </label>
      <label class="row" style="margin-bottom:10px; gap:8px; font-size:13px; color:var(--text2)">
        Long break every
        <input type="number" id="cfg-cycle" min="2" max="10" style="width:90px"> sessions
      </label>
      <label class="row" style="margin-bottom:10px; gap:6px; font-size:13px; color:var(--text2)">
        <input type="checkbox" id="cfg-sound" checked> Play sound on finish
      </label>
      <label class="row" style="margin-bottom:10px; gap:6px; font-size:13px; color:var(--text2)">
        <input type="checkbox" id="cfg-notify"> Browser notification
      </label>
      <label class="row" style="margin-bottom:10px; gap:6px; font-size:13px; color:var(--text2)">
        <input type="checkbox" id="cfg-auto"> Auto-start next phase
      </label>
      <div class="divider"></div>
      <div class="panel-label"><span>Recent sessions</span></div>
      <div id="log" class="muted" style="font-size:12px; max-height:140px; overflow-y:auto">No sessions yet today.</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Done</span></div>

<style>
.cycle-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border); }
.cycle-dot.done { background: var(--accent); border-color: var(--accent); }
.day-bar { flex:1; background: var(--surface2); border-radius: 3px 3px 0 0; min-height:3px; transition: height .3s; position: relative; }
.day-bar.today { background: var(--accent); }
.day-bar:hover::after { content: attr(data-tip); position:absolute; bottom: 100%; left:50%; transform: translateX(-50%); background: var(--bg3); padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; color: var(--text); margin-bottom: 4px; }
.day-label { flex:1; text-align: center; }
</style>

<script>
const $ = s => document.querySelector(s);
const STORE = 'pomo-v1';
const DAY = 86400000;

const defaults = { focus: 25, short: 5, long: 15, cycle: 4, sound: true, notify: false, auto: false };
let cfg = { ...defaults, ...(JSON.parse(localStorage.getItem(STORE + '-cfg') || '{}')) };
let history = JSON.parse(localStorage.getItem(STORE + '-hist') || '[]'); // [{date, mins, task, ended}]

let phase = 'focus'; // focus | short | long
let cycleCount = 0; // completed focus sessions in current cycle
let remaining = cfg.focus * 60;
let running = false;
let interval = null;
let phaseStart = null;

function save() { localStorage.setItem(STORE + '-cfg', JSON.stringify(cfg)); localStorage.setItem(STORE + '-hist', JSON.stringify(history)); }
function toast(m) { const t = $('#toast'); $('#toast-msg').textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
function fmt(secs) { const m = Math.floor(secs / 60); const s = secs % 60; return `${m}:${String(s).padStart(2,'0')}`; }
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function render() {
  $('#timer-display').textContent = fmt(remaining);
  $('#phase-text').textContent = phase === 'focus' ? 'Focus' : phase === 'short' ? 'Short break' : 'Long break';
  document.title = `${fmt(remaining)} — ${phase === 'focus' ? 'Focus' : 'Break'}`;
  for (let i = 1; i <= 4; i++) {
    $(`#dot-${i}`).classList.toggle('done', i <= cycleCount);
  }
  $('#start-btn').disabled = running;
  $('#pause-btn').disabled = !running;
  $('#start-btn').innerHTML = running ? '<i class="ti ti-player-play"></i> Running…' : '<i class="ti ti-player-play"></i> Start';
}

function tick() {
  remaining -= 1;
  if (remaining <= 0) {
    finishPhase();
    return;
  }
  render();
}

function start() {
  if (running) return;
  if (cfg.notify && 'Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  running = true;
  phaseStart = Date.now();
  interval = setInterval(tick, 1000);
  render();
}

function pause() {
  if (!running) return;
  running = false;
  clearInterval(interval);
  render();
}

function reset() {
  pause();
  remaining = cfg[phase === 'focus' ? 'focus' : phase === 'short' ? 'short' : 'long'] * 60;
  render();
}

function skip() {
  pause();
  nextPhase(false);
}

function finishPhase() {
  pause();
  if (phase === 'focus') {
    const mins = cfg.focus;
    history.push({ date: todayKey(), mins, task: $('#task').value.trim() || '(unlabeled)', ended: Date.now() });
    cycleCount += 1;
    save();
    notify(`Focus session done — take a ${cycleCount >= cfg.cycle ? 'long' : 'short'} break.`);
  } else {
    notify(`Break over — back to focus!`);
  }
  ping();
  nextPhase(true);
  renderStats();
  if (cfg.auto) start();
}

function nextPhase(completed) {
  if (phase === 'focus') {
    if (cycleCount >= cfg.cycle) { phase = 'long'; cycleCount = 0; }
    else phase = 'short';
  } else {
    phase = 'focus';
  }
  remaining = cfg[phase === 'focus' ? 'focus' : phase === 'short' ? 'short' : 'long'] * 60;
  render();
}

function notify(msg) {
  if (cfg.notify && 'Notification' in window && Notification.permission === 'granted') {
    new Notification('Pomodoro', { body: msg, silent: true });
  }
}

function ping() {
  if (!cfg.sound) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.2;
    o.start(); o.frequency.setValueAtTime(660, ctx.currentTime + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

function renderStats() {
  const today = todayKey();
  const todayLog = history.filter(h => h.date === today);
  $('#today-sessions').textContent = todayLog.length;
  $('#today-time').textContent = todayLog.reduce((s, h) => s + h.mins, 0) + 'm';
  $('#total-sessions').textContent = history.length;

  // streak: consecutive days with at least 1 session ending today (or yesterday if today none)
  const dates = new Set(history.map(h => h.date));
  let streak = 0;
  let d = new Date();
  if (!dates.has(todayKey())) d.setDate(d.getDate() - 1);
  while (true) {
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!dates.has(k)) break;
    streak += 1;
    d.setDate(d.getDate() - 1);
  }
  $('#streak').textContent = streak + ' 🔥';

  // week chart
  const bars = $('#week-bars'), labels = $('#week-labels');
  bars.innerHTML = ''; labels.innerHTML = '';
  let max = 1;
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dd = new Date(); dd.setDate(dd.getDate() - i);
    const key = `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
    const n = history.filter(h => h.date === key).length;
    days.push({ key, n, label: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dd.getDay()], today: i === 0 });
    if (n > max) max = n;
  }
  days.forEach(d => {
    const bar = document.createElement('div');
    bar.className = 'day-bar' + (d.today ? ' today' : '');
    bar.style.height = (d.n / max * 100) + '%';
    bar.dataset.tip = `${d.label}: ${d.n} session${d.n === 1 ? '' : 's'}`;
    bars.appendChild(bar);
    const lbl = document.createElement('div'); lbl.className = 'day-label'; lbl.textContent = d.label[0];
    labels.appendChild(lbl);
  });

  // log
  if (!todayLog.length) {
    $('#log').innerHTML = 'No sessions yet today.';
  } else {
    $('#log').innerHTML = todayLog.slice(-10).reverse().map(h => {
      const t = new Date(h.ended);
      return `<div style="padding:4px 0; border-bottom:1px solid var(--border)">
        <b style="color:var(--text2)">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</b>
        · ${h.mins}m
        · ${escapeHtml(h.task)}
      </div>`;
    }).join('');
  }
}
function escapeHtml(s) { return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }

// settings
['focus','short','long','cycle'].forEach(k => {
  const el = $(`#cfg-${k}`);
  el.value = cfg[k];
  el.addEventListener('change', () => {
    const v = Math.max(1, parseInt(el.value) || defaults[k]);
    cfg[k] = v; save();
    if (!running) { remaining = cfg[phase === 'focus' ? 'focus' : phase === 'short' ? 'short' : 'long'] * 60; render(); }
  });
});
['sound','notify','auto'].forEach(k => {
  const el = $(`#cfg-${k}`);
  el.checked = cfg[k];
  el.addEventListener('change', () => { cfg[k] = el.checked; save(); if (k === 'notify' && el.checked) Notification.requestPermission(); });
});

$('#start-btn').addEventListener('click', start);
$('#pause-btn').addEventListener('click', pause);
$('#skip-btn').addEventListener('click', skip);
$('#reset-btn').addEventListener('click', reset);

document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
});

render(); renderStats();
</script>

</body>
</html>
