<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atomic Orbital Viewer — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-atom-2"></i></div><div>Orbital Viewer</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(74,222,128,0.12);color:var(--green)"><i class="ti ti-atom-2"></i></div>
      <div>
        <div class="tool-title">Atomic Orbital Viewer</div>
        <div class="tool-desc">Shapes of the s, p and d orbitals with their phase lobes (blue + / red −) and angular nodes.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row" id="picker"></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <svg id="svg" viewBox="0 0 340 340" style="flex:none;width:340px;max-width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px"></svg>
      <div id="info" style="flex:1;min-width:220px"></div>
    </div>
    <div class="muted" style="font-size:12px">Schematic 2-D cross-sections of the boundary surfaces. Colours are the sign of the wavefunction (its phase), not charge.</div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .obtn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:13px}
  .obtn.active{border-color:var(--accent3);color:var(--text);background:rgba(124,109,240,0.12)}</style>

<script>
const $ = s => document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const POS='var(--accent3)', NEG='var(--red)';
const C=170;
function ellipse(cx,cy,rx,ry,deg,fill){ const e=document.createElementNS(NS,'ellipse');e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',rx);e.setAttribute('ry',ry);e.setAttribute('transform',`rotate(${deg} ${cx} ${cy})`);e.setAttribute('fill',fill);e.setAttribute('fill-opacity','0.55');e.setAttribute('stroke',fill);e.setAttribute('stroke-width','1.5');return e; }
function lobe(angleDeg,len,fill){ // lobe pointing at angle (0=right, CCW), tip at distance len
  const rad=angleDeg*Math.PI/180; const dist=len*0.55; const cx=C+Math.cos(rad)*dist, cy=C-Math.sin(rad)*dist;
  return ellipse(cx,cy,len*0.5,len*0.28,-angleDeg,fill);
}
const ORB={
  '1s':{l:0,nodes:0,sh:'sphere',draw:svg=>{ svg.appendChild(ellipse(C,C,95,95,0,POS)); }},
  '2s':{l:0,nodes:0,sh:'sphere (1 radial node)',draw:svg=>{ svg.appendChild(ellipse(C,C,110,110,0,POS)); const r=document.createElementNS(NS,'circle');r.setAttribute('cx',C);r.setAttribute('cy',C);r.setAttribute('r',50);r.setAttribute('fill','none');r.setAttribute('stroke','var(--text3)');r.setAttribute('stroke-dasharray','4 3');svg.appendChild(r); }},
  '2p':{l:1,nodes:1,sh:'dumbbell (2 lobes)',draw:svg=>{ svg.appendChild(lobe(90,150,POS)); svg.appendChild(lobe(270,150,NEG)); }},
  '3d xy':{l:2,nodes:2,sh:'cloverleaf (4 lobes, between axes)',draw:svg=>{ [[45,POS],[135,NEG],[225,POS],[315,NEG]].forEach(([a,c])=>svg.appendChild(lobe(a,120,c))); }},
  '3d x²−y²':{l:2,nodes:2,sh:'cloverleaf (4 lobes, on axes)',draw:svg=>{ [[0,POS],[90,NEG],[180,POS],[270,NEG]].forEach(([a,c])=>svg.appendChild(lobe(a,120,c))); }},
  '3d z²':{l:2,nodes:2,sh:'2 lobes + toroidal ring',draw:svg=>{ svg.appendChild(lobe(90,140,POS)); svg.appendChild(lobe(270,140,POS)); svg.appendChild(ellipse(C,C,70,26,0,NEG)); }},
};
const keys=Object.keys(ORB);
let active='2p';
$('#picker').innerHTML=keys.map(k=>`<button class="obtn" data-k="${k}">${k}</button>`).join('');

function render(){
  const svg=$('#svg'); svg.innerHTML='';
  // axes
  const ax=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke','var(--border)');l.setAttribute('stroke-width','1');l.setAttribute('stroke-dasharray','2 3');svg.appendChild(l);};
  ax(20,C,320,C); ax(C,20,C,320);
  const o=ORB[active]; o.draw(svg);
  // nucleus
  const nuc=document.createElementNS(NS,'circle');nuc.setAttribute('cx',C);nuc.setAttribute('cy',C);nuc.setAttribute('r',4);nuc.setAttribute('fill','var(--text)');svg.appendChild(nuc);
  document.querySelectorAll('.obtn').forEach(b=>b.classList.toggle('active',b.dataset.k===active));
  $('#info').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Orbital</div><div class="stat-value">${active}</div></div>
      <div class="stat-card"><div class="stat-label">ℓ</div><div class="stat-value">${o.l} (${['s','p','d'][o.l]})</div></div>
      <div class="stat-card"><div class="stat-label">Angular nodes</div><div class="stat-value">${o.l}</div></div>
      <div class="stat-card"><div class="stat-label">Orbitals in subshell</div><div class="stat-value">${2*o.l+1}</div></div>
    </div>
    <div style="margin-top:8px;font-size:13px"><b>Shape:</b> ${o.sh}</div>
    <div class="muted" style="font-size:12px;margin-top:6px">Number of angular (planar) nodes equals ℓ: s has 0, p has 1, d has 2. Adjacent lobes have opposite phase — overlap of like phases is what forms bonding molecular orbitals.</div>`;
}
document.querySelectorAll('.obtn').forEach(b=>b.addEventListener('click',()=>{ active=b.dataset.k; render(); }));
render();
</script>

</body>
</html>
