<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novelty Score Calculator — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-sparkles"></i></div><div>Novelty Score</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:860px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-sparkles"></i></div>
      <div>
        <div class="tool-title">Novelty Score Calculator</div>
        <div class="tool-desc">Compare your idea/abstract against prior work → a novelty score and the closest existing papers. Term-overlap (TF-IDF cosine), fully offline.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Your idea / abstract
      <textarea id="mine" style="min-height:90px" placeholder="Describe your proposed contribution…"></textarea>
    </label>
    <label class="fld">Prior work — one title or abstract per line
      <textarea id="prior" style="min-height:120px" placeholder="Existing paper 1 title/abstract…&#10;Existing paper 2 title/abstract…"></textarea>
    </label>
    <div class="row"><button class="btn btn-primary" id="run"><i class="ti ti-calculator"></i> Score novelty</button></div>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);margin-bottom:6px;font-size:13px}
  .bar{flex:none;width:120px;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
  .bar>div{height:100%}
  .big{font-size:40px;font-weight:800;font-family:Georgia,serif;text-align:center}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STOP=new Set('the a an and or but of to in on for with as by at from is are was were be been this that these those it its their our we they not no using used based study studies paper research method models data results approach new novel propose present develop'.split(' '));
function tf(t){ const m={}; (t.toLowerCase().match(/[a-z][a-z'-]{2,}/g)||[]).forEach(w=>{ if(!STOP.has(w))m[w]=(m[w]||0)+1; }); return m; }
function cosine(a,b){ let dot=0,na=0,nb=0; const keys=new Set([...Object.keys(a),...Object.keys(b)]); keys.forEach(k=>{ const x=a[k]||0,y=b[k]||0; dot+=x*y; }); for(const k in a)na+=a[k]*a[k]; for(const k in b)nb+=b[k]*b[k]; return (na&&nb)?dot/Math.sqrt(na*nb):0; }

$('#run').addEventListener('click',()=>{
  const mine=$('#mine').value.trim(); const prior=$('#prior').value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const out=$('#out');
  if(!mine){ out.innerHTML='<div class="muted" style="margin-top:6px">Describe your idea.</div>'; return; }
  if(!prior.length){ out.innerHTML='<div class="muted" style="margin-top:6px">Paste some prior work to compare against.</div>'; return; }
  const mv=tf(mine);
  const sims=prior.map(p=>({p,sim:cosine(mv,tf(p))})).sort((a,b)=>b.sim-a.sim);
  const maxSim=sims[0].sim; const novelty=Math.round((1-maxSim)*100);
  const band=novelty>=70?'--green':novelty>=45?'--amber':'--red';
  const verdict=novelty>=70?'Highly distinct from the listed prior work':novelty>=45?'Moderately novel — overlaps with some prior work':'Substantial overlap — sharpen your distinct contribution';
  out.innerHTML=`<div class="big" style="color:var(${band})">${novelty}<span style="font-size:18px">/100</span></div>
    <div style="text-align:center;color:var(${band});font-weight:600;margin-bottom:12px">${verdict}</div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px">Closest prior work (similarity)</div>`+
    sims.slice(0,8).map(x=>{ const pc=Math.round(x.sim*100); const c=pc>=55?'--red':pc>=30?'--amber':'--green'; return `<div class="prow"><div class="bar"><div style="width:${pc}%;background:var(${c})"></div></div><span style="width:42px;color:var(${c})">${pc}%</span><span>${esc(x.p.slice(0,90))}${x.p.length>90?'…':''}</span></div>`; }).join('')+
    `<div class="muted" style="font-size:12px;margin-top:8px">Novelty = 100 − closest match. This measures <i>wording</i> overlap, not true conceptual novelty — low scores mean "phrased very like existing work", which is still worth checking.</div>`;
});
</script>

</body>
</html>
