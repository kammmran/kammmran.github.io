<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overclaim Detector — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-alert-triangle"></i></div><div>Overclaim Detector</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:860px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(248,113,113,0.12);color:var(--red)"><i class="ti ti-alert-triangle"></i></div>
      <div>
        <div class="tool-title">Overclaim Detector</div>
        <div class="tool-desc">Flags absolute and exaggerated wording — "proves", "always", "groundbreaking" — and suggests appropriately hedged alternatives.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <label class="fld">Paste your text
      <textarea id="txt" style="min-height:200px" placeholder="Our groundbreaking method completely proves that this approach is always better and will revolutionize the field."></textarea>
    </label>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  #render{line-height:1.9;font-size:14px}
  .oc{background:rgba(248,113,113,0.18);box-shadow:inset 0 -2px 0 var(--red);border-radius:3px;padding:0 2px;cursor:help}
  .sugg-row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);margin-bottom:6px;font-size:13px}
  .sugg-row b{color:var(--red)} .sugg-row em{color:var(--green);font-style:normal}</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const lexicon = [
  ['prove[sd]?|proven|proof','demonstrate / provide evidence for'],
  ['always','often / typically'],
  ['never','rarely / not in our data'],
  ['undeniabl[ey]|indisputabl[ey]|irrefutabl[ey]','strong evidence suggests'],
  ['definitely|certainly|undoubtedly|clearly|obviously','likely / appears to'],
  ['completely|totally|entirely|fully|100%','largely / substantially'],
  ['revolutionary|groundbreaking|game[- ]?changing|paradigm[- ]?shift\\w*','novel / notable'],
  ['unprecedented','uncommon / not previously reported'],
  ['first ever|the first to|world[- ]?first','among the first to'],
  ['best|optimal|perfect|superior|unmatched','favourable / better-performing'],
  ['guarantee[sd]?|ensures?','is expected to / supports'],
  ['cure[sd]?','treat / alleviate'],
  ['dramatic\\w*|drastic\\w*|massive\\w*|huge','substantial / marked'],
  ['all\\b','many / most (where appropriate)'],
  ['none\\b','few'],
  ['must\\b','may / is likely to'],
];
const compiled = lexicon.map(([p,s])=>({re:new RegExp('\\b('+p+')\\b','ig'), sug:s}));

function run(){
  const t=$('#txt').value;
  const out=$('#out');
  if(!t.trim()){ out.innerHTML=''; return; }
  const found={}; let total=0;
  // mark matches; collect counts
  let html = esc(t);
  compiled.forEach(({re,sug})=>{
    html = html.replace(re,(m)=>{
      total++; const key=m.toLowerCase();
      found[key]=found[key]||{n:0,sug}; found[key].n++;
      return `<span class="oc" title="overclaim → try: ${sug}">${m}</span>`;
    });
  });
  const words = (t.match(/\b[\w'-]+\b/g)||[]).length || 1;
  const density = (total/words*1000);
  const band = density<3?'--green':density<8?'--amber':'--red';
  const list = Object.entries(found).sort((a,b)=>b[1].n-a[1].n)
    .map(([w,o])=>`<div class="sugg-row"><span><b>${esc(w)}</b> ×${o.n}</span><span>→ <em>${o.sug}</em></span></div>`).join('');
  out.innerHTML = `
    <div class="stat-grid" style="margin:4px 0 12px">
      <div class="stat-card"><div class="stat-label">Words</div><div class="stat-value">${words}</div></div>
      <div class="stat-card"><div class="stat-label">Overclaims</div><div class="stat-value" style="color:var(--red)">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Per 1000 words</div><div class="stat-value" style="color:var(${band})">${density.toFixed(1)}</div></div>
    </div>
    <div id="render" style="margin-bottom:14px">${html.replace(/\n/g,'<br>')}</div>
    ${list?`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px">Suggested softening</div>${list}`:'<div class="muted" style="font-size:13px">No overclaiming language detected. 👍</div>'}`;
}
$('#txt').addEventListener('input',run);
</script>

</body>
</html>
