<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citation Age Distribution — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-history"></i></div><div>Citation Age Distribution</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:860px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(45,212,191,0.12);color:var(--teal)"><i class="ti ti-history"></i></div>
      <div>
        <div class="tool-title">Citation Age Distribution</div>
        <div class="tool-desc">Paste a reference list — years are detected automatically. See how recent your sources are.</div>
      </div>
    </div>
  </div>

  <div class="panel" style="min-height:auto;gap:14px">
    <div class="row">
      <label class="fld">Manuscript year
        <input type="number" id="yr" style="width:120px" min="1900" max="2100">
      </label>
    </div>
    <label class="fld">Reference list — one reference per line (the most recent 4-digit year on each line is used)
      <textarea id="refs" style="min-height:210px" placeholder="Smith, J. (2021). ...&#10;Doe, A. (2008). ...&#10;Lee, B. (1998). ..."></textarea>
    </label>
    <div class="row"><button class="btn btn-primary" id="run"><i class="ti ti-chart-histogram"></i> Analyze</button></div>
    <div id="out"></div>
  </div>
</main>

<style>.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
  .bar-row{display:flex;align-items:center;gap:10px;margin:3px 0;font-size:12px}
  .bar-lbl{width:78px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
  .bar-track{flex:1;background:var(--bg3);border-radius:4px;overflow:hidden;height:18px}
  .bar-fill{height:100%;background:var(--teal);border-radius:4px}
  .bar-n{width:34px;color:var(--text3);font-variant-numeric:tabular-nums}</style>

<script>
const $ = s => document.querySelector(s);
$('#yr').value = new Date().getFullYear();

function run(){
  const now = parseInt($('#yr').value,10) || new Date().getFullYear();
  const lines = $('#refs').value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const out = $('#out');
  const years=[], noYear=[];
  lines.forEach(l=>{
    const m = l.match(/\b(1[89]\d{2}|20\d{2}|2100)\b/g);
    if(m){ years.push(Math.max(...m.map(Number))); } else { noYear.push(l); }
  });
  if(!years.length){ out.innerHTML='<div class="muted" style="margin-top:6px">No years detected. Paste references that include publication years.</div>'; return; }
  const ages = years.map(y=>Math.max(0,now-y)).sort((a,b)=>a-b);
  const sum = ages.reduce((a,b)=>a+b,0);
  const mean = sum/ages.length;
  const median = ages.length%2 ? ages[(ages.length-1)/2] : (ages[ages.length/2-1]+ages[ages.length/2])/2;
  const recent5 = ages.filter(a=>a<=5).length;
  const old10 = ages.filter(a=>a>10).length;
  const oldest = Math.max(...ages), newest = Math.min(...ages);
  // buckets
  const buckets = [['0–2',0],['3–5',0],['6–10',0],['11–20',0],['20+',0]];
  ages.forEach(a=>{ if(a<=2)buckets[0][1]++; else if(a<=5)buckets[1][1]++; else if(a<=10)buckets[2][1]++; else if(a<=20)buckets[3][1]++; else buckets[4][1]++; });
  const maxB = Math.max(...buckets.map(b=>b[1]),1);
  const pct = n=>(n/ages.length*100).toFixed(0);

  out.innerHTML = `
    <div class="stat-grid" style="margin:10px 0 14px">
      <div class="stat-card"><div class="stat-label">Refs with year</div><div class="stat-value">${ages.length}</div></div>
      <div class="stat-card"><div class="stat-label">Median age</div><div class="stat-value">${median} yr</div></div>
      <div class="stat-card"><div class="stat-label">Mean age</div><div class="stat-value">${mean.toFixed(1)} yr</div></div>
      <div class="stat-card"><div class="stat-label">≤ 5 years old</div><div class="stat-value" style="color:var(--green)">${pct(recent5)}%</div></div>
      <div class="stat-card"><div class="stat-label">&gt; 10 years old</div><div class="stat-value" style="color:var(--amber)">${pct(old10)}%</div></div>
      <div class="stat-card"><div class="stat-label">Newest / oldest</div><div class="stat-value" style="font-size:14px">${now-newest} → ${now-oldest}</div></div>
    </div>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px">Age distribution (years before manuscript)</div>
    ${buckets.map(([lbl,n])=>`<div class="bar-row"><div class="bar-lbl">${lbl} yr</div><div class="bar-track"><div class="bar-fill" style="width:${n/maxB*100}%"></div></div><div class="bar-n">${n}</div></div>`).join('')}
    ${noYear.length?`<div class="muted" style="font-size:12px;margin-top:10px"><i class="ti ti-alert-triangle"></i> ${noYear.length} line${noYear.length>1?'s':''} had no detectable year and ${noYear.length>1?'were':'was'} skipped.</div>`:''}`;
}
$('#run').addEventListener('click',run);
</script>

</body>
</html>
