<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMILES Canonicalizer — Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-list-letters"></i></div><div>SMILES Canonicalizer</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:1100px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(124,109,240,0.15);color:var(--accent3)"><i class="ti ti-list-letters"></i></div>
      <div>
        <div class="tool-title">Batch SMILES Canonicalizer</div>
        <div class="tool-desc">Normalise many SMILES to canonical form, flag invalid entries, and find duplicate structures.</div>
      </div>
    </div>
    <div class="row">
      <label class="chk-lbl"><input type="checkbox" id="iso" checked> Isomeric</label>
      <button class="btn btn-sm" id="dl"><i class="ti ti-download"></i> CSV</button>
    </div>
  </div>

  <div class="workspace">
    <div class="panel">
      <div class="panel-label"><span>Input SMILES (one per line)</span><button class="btn btn-sm btn-ghost" id="sample">Sample</button></div>
      <textarea id="input" placeholder="CCO&#10;OCC&#10;c1ccccc1&#10;C1=CC=CC=C1"></textarea>
    </div>
    <div class="panel">
      <div class="panel-label"><span>Canonical output</span><span class="muted" id="stat" style="text-transform:none;letter-spacing:0;font-weight:400"></span></div>
      <div id="out" class="output-box" style="font-size:13px"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"><i class="ti ti-check"></i><span></span></div>

<style>
  .chk-lbl{font-size:13px;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
  .crow{padding:5px 0;border-bottom:1px solid var(--border);font-family:ui-monospace,Menlo,monospace;font-size:12px;display:flex;gap:8px;align-items:baseline}
  .crow .bad{color:var(--red)} .dup{color:var(--amber)}
  .cidx{color:var(--text3);width:24px;flex-shrink:0;text-align:right}
</style>

<script src="https://cdn.jsdelivr.net/npm/openchemlib@8/dist/openchemlib-full.js"></script>
<script>
const $ = s => document.querySelector(s);
function toast(m){ const t=$('#toast'); t.querySelector('span').textContent=m; t.classList.add('show'); clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ready(cb){ if(window.OCL&&OCL.Molecule)return cb(); let n=0;const iv=setInterval(()=>{if(window.OCL&&OCL.Molecule){clearInterval(iv);cb();}else if(++n>60){clearInterval(iv);$('#out').innerHTML='<span class="bad">Could not load chemistry engine.</span>';}},100); }

let rows=[];
function run(){
  ready(()=>{
    const lines=$('#input').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const iso=$('#iso').checked;
    const seen={}; rows=[]; let valid=0,dups=0;
    lines.forEach(smi=>{
      try{
        const mol=OCL.Molecule.fromSmiles(smi);
        if(mol.getAllAtoms()===0) throw 0;
        const canon=iso?mol.toIsomericSmiles():mol.toSmiles();
        const isDup=seen[canon]!==undefined;
        if(isDup) dups++; else seen[canon]=1;
        rows.push({in:smi,out:canon,ok:true,dup:isDup});
        valid++;
      }catch(e){ rows.push({in:smi,out:'invalid',ok:false}); }
    });
    $('#stat').textContent = lines.length?`${valid} valid · ${lines.length-valid} invalid · ${dups} duplicate`:'';
    $('#out').innerHTML = rows.length? rows.map((r,i)=>
      `<div class="crow"><span class="cidx">${i+1}</span><span class="${r.ok?(r.dup?'dup':''):'bad'}">${esc(r.out)}${r.dup?' &nbsp;<span class="chip">dup</span>':''}</span></div>`
    ).join('') : '<span class="muted">Paste SMILES to canonicalize.</span>';
  });
}
$('#input').addEventListener('input',()=>{clearTimeout(window._r);window._r=setTimeout(run,150);});
$('#iso').addEventListener('change',run);
$('#sample').addEventListener('click',()=>{ $('#input').value='CCO\nOCC\nc1ccccc1\nC1=CC=CC=C1\nCC(=O)Oc1ccccc1C(=O)O\nnot_a_smiles'; run(); });
$('#dl').addEventListener('click',()=>{
  if(!rows.length)return;
  const csv='input,canonical,valid,duplicate\n'+rows.map(r=>`"${r.in}","${r.out}",${r.ok},${!!r.dup}`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='canonical-smiles.csv';a.click();toast('CSV downloaded');
});
run();
</script>

</body>
</html>
