<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrhenius Equation - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-chart-line"></i></div><div>Arrhenius Equation</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in" style="max-width:820px">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(251,191,36,0.12);color:var(--amber)"><i class="ti ti-chart-line"></i></div>
      <div>
        <div class="tool-title">Arrhenius Equation</div>
        <div class="tool-desc">k = A·e^(−Ea/RT). Solve for any term, or get Ea from two rate constants at two temperatures.</div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-t="single">k = A·e^(−Ea/RT)</button>
    <button class="tab" data-t="two">Two-temperature (find Ea)</button>
  </div>

  <div class="panel" id="p-single" style="min-height:auto">
    <div class="grid2">
      <label class="fld">Rate constant k<input type="number" id="k" step="any"></label>
      <label class="fld">Pre-exponential A<input type="number" id="A" step="any"></label>
      <label class="fld">Activation energy Ea (kJ/mol)<input type="number" id="Ea" step="any"></label>
      <label class="fld">Temperature T (K)<input type="number" id="T" step="any" value="298.15"></label>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">Leave one of k, A, Ea or T blank to solve for it.</div>
    <div id="s_out" class="output-box" style="min-height:auto;margin-top:14px"></div>
  </div>

  <div class="panel" id="p-two" style="min-height:auto;display:none">
    <div class="grid2">
      <label class="fld">k₁<input type="number" id="k1" step="any"></label>
      <label class="fld">T₁ (K)<input type="number" id="T1" step="any"></label>
      <label class="fld">k₂<input type="number" id="k2" step="any"></label>
      <label class="fld">T₂ (K)<input type="number" id="T2" step="any"></label>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">ln(k₂/k₁) = −(Ea/R)(1/T₂ − 1/T₁).</div>
    <div id="t_out" class="output-box" style="min-height:auto;margin-top:14px"></div>
  </div>
</main>

<style>.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}@media(max-width:600px){.grid2{grid-template-columns:1fr}}</style>

<script>
const $ = s => document.querySelector(s);
const num = id => { const v=parseFloat($('#'+id).value); return Number.isFinite(v)?v:null; };
const R=8.314462618;

document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  $('#p-single').style.display=t.dataset.t==='single'?'':'none';
  $('#p-two').style.display=t.dataset.t==='two'?'':'none';
}));

function single(){
  let k=num('k'),A=num('A'),Ea=num('Ea'),T=num('T');
  const vals={k,A,Ea,T}; const blanks=Object.keys(vals).filter(x=>vals[x]===null);
  const out=$('#s_out');
  if(blanks.length!==1){ out.innerHTML=blanks.length===0?'<span class="muted">Leave one field blank.</span>':'<span class="muted">Leave exactly one field blank.</span>'; return; }
  const b=blanks[0]; let res='';
  try{
    const EaJ = Ea!==null?Ea*1000:null;
    if(b==='k'){ k=A*Math.exp(-EaJ/(R*T)); res=`k = <b>${k.toPrecision(5)}</b>`; }
    else if(b==='A'){ A=k/Math.exp(-EaJ/(R*T)); res=`A = <b>${A.toPrecision(5)}</b>`; }
    else if(b==='Ea'){ Ea=-R*T*Math.log(k/A)/1000; res=`Ea = <b>${Ea.toPrecision(5)} kJ/mol</b>`; }
    else { T=-EaJ/(R*Math.log(k/A)); res=`T = <b>${T.toPrecision(5)} K</b>`; }
    if(!Number.isFinite(parseFloat(res.replace(/[^0-9.eE+-]/g,'')))) throw 0;
  }catch(e){ out.innerHTML='<span class="muted">Check inputs (k, A must be positive for logs).</span>'; return; }
  out.innerHTML=res;
}
function two(){
  const k1=num('k1'),T1=num('T1'),k2=num('k2'),T2=num('T2');
  const out=$('#t_out');
  if([k1,T1,k2,T2].some(v=>v===null)){ out.innerHTML='<span class="muted">Enter all four values.</span>'; return; }
  if(k1<=0||k2<=0||T1<=0||T2<=0||T1===T2){ out.innerHTML='<span class="muted">k and T must be positive and T₁ ≠ T₂.</span>'; return; }
  const Ea = -R*Math.log(k2/k1)/(1/T2 - 1/T1);
  const A = k1/Math.exp(-Ea/(R*T1));
  out.innerHTML=`Activation energy Ea = <b>${(Ea/1000).toPrecision(5)} kJ/mol</b><div class="muted" style="font-size:13px;margin-top:6px">Pre-exponential A ≈ ${A.toPrecision(4)} · ln(k₂/k₁) = ${Math.log(k2/k1).toFixed(4)}</div>`;
}
['k','A','Ea','T'].forEach(id=>$('#'+id).addEventListener('input',single));
['k1','T1','k2','T2'].forEach(id=>$('#'+id).addEventListener('input',two));
single();
</script>

</body>
</html>
