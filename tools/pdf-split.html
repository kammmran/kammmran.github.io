<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Split - Academy Tools</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/theme.css">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../academy.html"><i class="ti ti-arrow-left"></i> Back to tools</a>
  <div class="logo"><div class="logo-icon"><i class="ti ti-scissors"></i></div><div>PDF Split</div></div>
  <div style="width:120px"></div>
</header>

<main class="tool-page fade-in">
  <div class="tool-header">
    <div class="tool-title-block">
      <div class="tool-icon" style="background:rgba(244,114,182,0.12);color:var(--pink)"><i class="ti ti-scissors"></i></div>
      <div>
        <div class="tool-title">PDF Split</div>
        <div class="tool-desc">Extract specific pages. Supports ranges like <code>1-3,5,7-9</code>. Stays on your device.</div>
      </div>
    </div>
  </div>

  <div class="workspace single">
    <div class="panel">
      <div class="dropzone" id="drop">
        <i class="ti ti-file-upload"></i>
        <div class="dropzone-title" id="drop-title">Drop a PDF here, or click to choose</div>
        <div class="dropzone-hint" id="drop-hint">One file at a time.</div>
        <input type="file" id="file" accept="application/pdf" hidden>
      </div>

      <div class="row" style="margin-top:14px; align-items:flex-end">
        <div style="flex:1; min-width:220px">
          <div class="panel-label"><span>Pages to extract</span></div>
          <input type="text" id="ranges" placeholder="e.g. 1-3,5,7-9" disabled>
        </div>
        <button class="btn btn-primary" id="split-btn" disabled><i class="ti ti-scissors"></i> Extract & download</button>
      </div>
      <div id="status" class="muted" style="font-size:13px; margin-top:10px"></div>
    </div>
  </div>
</main>

<script>
const drop = document.getElementById('drop');
const file = document.getElementById('file');
const ranges = document.getElementById('ranges');
const btn = document.getElementById('split-btn');
const statusEl = document.getElementById('status');
const dropTitle = document.getElementById('drop-title');
const dropHint = document.getElementById('drop-hint');

let pdfBytes = null, pageCount = 0, fileName = '';

drop.addEventListener('click', () => file.click());
;['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
;['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); });
file.addEventListener('change', e => { if (e.target.files[0]) handle(e.target.files[0]); });

async function handle(f) {
  if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) {
    statusEl.innerHTML = '<span style="color:var(--red)">Not a PDF.</span>';
    return;
  }
  fileName = f.name.replace(/\.pdf$/i, '');
  pdfBytes = await f.arrayBuffer();
  if (!window.PDFLib) await new Promise(r => setTimeout(r, 200));
  const doc = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
  pageCount = doc.getPageCount();
  dropTitle.textContent = f.name;
  dropHint.textContent = `${pageCount} page${pageCount > 1 ? 's' : ''} loaded. Enter ranges below.`;
  ranges.disabled = false;
  ranges.placeholder = `e.g. 1-${pageCount} or 1,3,5-7`;
  ranges.value = `1-${pageCount}`;
  btn.disabled = false;
  statusEl.textContent = '';
}

function parseRanges(s, max) {
  const out = [];
  const seen = new Set();
  for (const part of s.split(',').map(x => x.trim()).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) throw new Error(`Invalid range: "${part}"`);
    const a = parseInt(m[1], 10);
    const b = m[2] ? parseInt(m[2], 10) : a;
    if (a < 1 || b < 1 || a > max || b > max) throw new Error(`Pages must be 1–${max}`);
    const [lo, hi] = a <= b ? [a, b] : [b, a];
    for (let p = lo; p <= hi; p++) {
      if (!seen.has(p)) { seen.add(p); out.push(p - 1); }
    }
  }
  if (!out.length) throw new Error('No pages selected.');
  return out;
}

btn.addEventListener('click', async () => {
  try {
    statusEl.textContent = 'Extracting…';
    btn.disabled = true;
    const idxs = parseRanges(ranges.value, pageCount);
    const src = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    const out = await PDFLib.PDFDocument.create();
    const pages = await out.copyPages(src, idxs);
    pages.forEach(p => out.addPage(p));
    const bytes = await out.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${fileName}-pages.pdf`; a.click();
    URL.revokeObjectURL(url);
    statusEl.innerHTML = `<i class="ti ti-circle-check" style="color:var(--green)"></i> Extracted ${idxs.length} page${idxs.length>1?'s':''}.`;
  } catch (e) {
    statusEl.innerHTML = `<i class="ti ti-alert-circle" style="color:var(--red)"></i> ${e.message}`;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
